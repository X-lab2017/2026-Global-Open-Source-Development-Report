name: Publish GOSD preview to Pages

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'chapters/chapter1/**'
      - 'chapters/chapter6/**'
      - 'chapters/引言-人工智能时代的开源发展.md'
      - 'chapters/引言-宣言.md'
      - 'chapters/introduction.en.md'
      - 'appendices/附录B-宣言.md'
      - 'outline/**'
      - 'appendices/附录A-指标体系与数据来源.md'
      - 'data/meta/**'
      - 'data/processed/**'
      - 'figures/chapter1/**'
      - 'figures/chapter6/**'
      - '.github/workflows/gosd-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosd-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and check preview only
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 preview/web/import_report.py --repo-root . --source-ref "$GITHUB_SHA"
          python3 preview/web/build_portal.py --output _site --base-path "$BASE_PATH"
          python3 preview/web/check_portal.py --output _site --base-path "$BASE_PATH"
          python3 preview/web/check_report.py --output _site
          python3 preview/web/check_chapter6.py --output _site
          python3 preview/web/check_chapter_visuals.py --output _site --repo-root .
          python3 preview/web/check_chapter1_sample.py --output _site
          python3 preview/web/check_frontmatter_publication.py --output _site
          python3 preview/web/check_goso.py --output _site
          python3 preview/web/check_vmap.py --output _site
          python3 preview/web/check_vmap_publication.py --output _site
          python3 preview/web/check_cmap.py --output _site
          python3 preview/web/check_cmap_publication.py --output _site
          node preview/web/check_cmap_network.mjs _site/assets/cmap/data.json
          python3 preview/web/check_goso_maps.py --output _site
          python3 preview/web/check_imap_publication.py --output _site
          python3 preview/web/check_tmap_publication.py --output _site
          python3 preview/web/check_dmap_publication.py --output _site
          python3 preview/web/check_amap_publication.py --output _site
          python3 preview/web/check_gmap_publication.py --output _site
          python3 preview/web/check_gosr.py --output _site
          python3 preview/web/check_landscape.py --output _site
          node preview/web/check_landscape_v3.cjs _site/assets/landscape/v3-data.json
          python3 preview/web/check_landscape_atlas.py --output _site
          python3 preview/web/check_landscape_theme.py --output _site
          python3 preview/web/check_gosl_landscapes.py --output _site
          python3 preview/web/check_gosm.py --output _site
          for file in _site/*.js _site/*.mjs; do node --input-type=module --check < "$file"; done
          node --check _site/chapter-visuals.js
          node --check _site/report.js
          node --check _site/portal.js
          node --check _site/explore.js
      - name: Upload generated preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
