name: Verify deployed appendix publication
on:
  workflow_run:
    workflows: ['Publish GOSD preview to Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install review tools
        run: |
          python3 -m pip install pymupdf==1.26.5 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify live editions and render review images
        run: python3 preview/web/check_appendix_live.py
