<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1060" viewBox="0 0 880 1060" role="img"><title>企业与组织的协作责任</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1060" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">实施步骤 → 协作分工 → 后续观察</text><rect x="24" y="50" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">04  把上游维护纳入产品责任</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">可维护、可复用的基础</text><rect x="40" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  看清关键依赖</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">核对版本、上游来源及依赖它们</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">的产品。</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">产品团队</text><text x="40" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">说明依赖与使用需求</text><text x="40" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">责任覆盖</text><rect x="316" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  承担维护工作</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">明确责任团队，把修复与适配回</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">馈上游。</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">研发与维护团队</text><text x="316" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">配置时间并贡献改进</text><text x="316" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">回馈落实</text><rect x="592" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  检验支持是否有效</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">结合使用问题与上游反馈，调整</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">投入与交接。</text><text x="592" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">上游社区</text><text x="592" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同评审和安排维护</text><text x="592" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">交接连续</text><rect x="24" y="370" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="397" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">05  让每次发布清晰、可用、可追溯</text><text x="40" y="423" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">透明治理与公共价值</text><rect x="40" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  整理版本材料</text><text x="52" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">把代码、模型、数据说明与上游</text><text x="52" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">信息对应起来。</text><path d="M290 498H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">发布团队</text><text x="40" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">整理材料与运行示例</text><text x="40" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">材料对应</text><rect x="316" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  提供可用入口</text><text x="328" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">同时发布运行示例、条件说明与</text><text x="328" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">问题反馈渠道。</text><path d="M566 498H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">审查与维护角色</text><text x="316" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">核对条件及变更记录</text><text x="316" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">示例可用</text><rect x="592" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  持续修订档案</text><text x="604" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">记录版本变化、已知局限与下游</text><text x="604" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">使用反馈。</text><text x="592" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">下游使用者</text><text x="592" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">复核并反馈适配问题</text><text x="592" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">变化可追踪</text><rect x="24" y="690" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="717" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">06  为协作者成长提供时间与认可</text><text x="40" y="743" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">持续参与与人才成长</text><rect x="40" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  预留协作时间</text><text x="52" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">把上游参与、外部评审与文档维</text><text x="52" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">护放入工作计划。</text><path d="M290 818H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">研发管理者</text><text x="40" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">安排时间与认可方式</text><text x="40" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">参与持续性</text><rect x="316" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  开放多种角色</text><text x="328" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">让代码、测试、翻译与支持贡献</text><text x="328" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">得到认可。</text><path d="M566 818H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">团队与导师</text><text x="316" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">提供反馈和成长机会</text><text x="316" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">贡献角色</text><rect x="592" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  形成成长路径</text><text x="604" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">支持贡献者逐步承担评审、发布</text><text x="604" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">与维护责任。</text><text x="592" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">外部协作者</text><text x="592" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">参与任务与共同评审</text><text x="592" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">外部协作</text><text x="440" y="1019" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">图 6-3-1 企业与组织的协作责任</text><text x="440" y="1047" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">前文证据与行动建议的关系示意；连线不表示数量、权重或已验证的因果关系。</text></g></svg>