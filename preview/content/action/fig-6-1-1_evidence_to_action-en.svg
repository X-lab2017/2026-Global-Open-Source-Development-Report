<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>Connect four perspectives to three shared tasks</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-1-1 / EVIDENCE TO ACTION</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">Connect four perspectives to three shared tasks</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">Shared tasks cross actor boundaries; the nine recommendations need coordinated effort.</text><path d="M312 205C390 205 410 229 488 229" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 205C390 205 410 529 488 529" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 303C390 303 410 229 488 229" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 303C390 303 410 379 488 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 401C390 401 410 379 488 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 499C390 499 410 379 488 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M312 499C390 499 410 529 488 529" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.35" marker-end="url(#arrow)"/><path d="M788 229C862 229 894 229 968 229" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 229C862 229 894 379 968 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 229C862 229 894 529 968 529" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 379C862 379 894 229 968 229" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 379C862 379 894 379 968 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 379C862 379 894 529 968 529" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 529C862 529 894 229 968 229" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 529C862 529 894 379 968 379" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><path d="M788 529C862 529 894 529 968 529" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.25" marker-end="url(#arrow)"/><text x="28" y="155" font-size="12" font-weight="400" fill="#587382">FOUR RESEARCH PERSPECTIVES</text><text x="488" y="155" font-size="12" font-weight="400" fill="#587382">THREE SHARED TASKS</text><text x="968" y="155" font-size="12" font-weight="400" fill="#587382">THREE ACTORS · NINE ACTIONS</text><rect x="28" y="168" width="284" height="74" rx="7" fill="#fff" stroke="#cadce5"/><text x="44" y="192" font-size="13" font-weight="600" fill="#156993">GOSO</text><text x="44" y="220" font-size="16" font-weight="400" fill="#18394c">participation &amp; connections</text><rect x="28" y="266" width="284" height="74" rx="7" fill="#fff" stroke="#cadce5"/><text x="44" y="290" font-size="13" font-weight="600" fill="#156993">GOSR</text><text x="44" y="318" font-size="16" font-weight="400" fill="#18394c">actors &amp; responsibility</text><rect x="28" y="364" width="284" height="74" rx="7" fill="#fff" stroke="#cadce5"/><text x="44" y="388" font-size="13" font-weight="600" fill="#156993">GOSL</text><text x="44" y="416" font-size="16" font-weight="400" fill="#18394c">functions &amp; evolution</text><rect x="28" y="462" width="284" height="74" rx="7" fill="#fff" stroke="#cadce5"/><text x="44" y="486" font-size="13" font-weight="600" fill="#156993">GOSM</text><text x="44" y="514" font-size="16" font-weight="400" fill="#18394c">supply, reuse &amp; openness</text><rect x="488" y="172" width="300" height="114" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="508" y="199" font-size="13" font-weight="400" fill="#156993">01 / X1 · X3</text><text x="508" y="233" font-size="21" font-weight="600" fill="#18394c">Participation and</text><text x="508" y="262" font-size="21" font-weight="600" fill="#18394c">growth</text><rect x="488" y="322" width="300" height="114" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="508" y="349" font-size="13" font-weight="400" fill="#156993">02 / X2 · X3</text><text x="508" y="383" font-size="21" font-weight="600" fill="#18394c">Maintainable,</text><text x="508" y="412" font-size="21" font-weight="600" fill="#18394c">reusable foundations</text><rect x="488" y="472" width="300" height="114" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="508" y="499" font-size="13" font-weight="400" fill="#156993">03 / X4</text><text x="508" y="533" font-size="21" font-weight="600" fill="#18394c">Governance &amp; public</text><text x="508" y="562" font-size="21" font-weight="600" fill="#18394c">value</text><rect x="968" y="172" width="284" height="114" rx="7" fill="#fff" stroke="#cadce5"/><text x="984" y="197" font-size="12" font-weight="400" fill="#156993">6.2 / THREE ACTIONS</text><text x="984" y="229" font-size="19" font-weight="600" fill="#18394c">Public institutions</text><text x="984" y="255" font-size="13" font-weight="400" fill="#587382">Provide sustained support and</text><text x="984" y="274" font-size="13" font-weight="400" fill="#587382">shared rules</text><rect x="968" y="322" width="284" height="114" rx="7" fill="#fff" stroke="#cadce5"/><text x="984" y="347" font-size="12" font-weight="400" fill="#156993">6.3 / THREE ACTIONS</text><text x="984" y="379" font-size="19" font-weight="600" fill="#18394c">Companies &amp; orgs</text><text x="984" y="405" font-size="13" font-weight="400" fill="#587382">Connect use, releases and</text><text x="984" y="424" font-size="13" font-weight="400" fill="#587382">maintenance</text><rect x="968" y="472" width="284" height="114" rx="7" fill="#fff" stroke="#cadce5"/><text x="984" y="497" font-size="12" font-weight="400" fill="#156993">6.4 / THREE ACTIONS</text><text x="984" y="529" font-size="19" font-weight="600" fill="#18394c">Communities &amp; partners</text><text x="984" y="555" font-size="13" font-weight="400" fill="#587382">Open participation paths and</text><text x="984" y="574" font-size="13" font-weight="400" fill="#587382">share maintenance</text><rect x="28" y="619" width="1224" height="119" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="50" y="650" font-size="20" font-weight="600" fill="#18394c">Shared goals need shared responsibilities</text><text x="50" y="685" font-size="18" font-weight="400" fill="#587382">Public support improves conditions. Companies connect products and maintenance. Communities bring participants and</text><text x="50" y="713" font-size="18" font-weight="400" fill="#587382">public needs together. The three tasks support sustained co-creation and its public value.</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">Action pathways · Lines do not encode quantities, weights or established causal effects.</text></g></svg>