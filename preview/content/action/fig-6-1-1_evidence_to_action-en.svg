<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img"><title>Evidence, shared tasks and responsibilities</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1000" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">EVIDENCE → THREE SHARED TASKS → RESPONSIBILITIES</text><text x="24" y="57" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Starting point: sustained co-creation and its public value</text><rect x="24" y="77" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="102" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSO</text><text x="40" y="132" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">Ecosystem maps: participation and</text><text x="40" y="154" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">coverage</text><rect x="452" y="77" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="468" y="102" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSR</text><text x="468" y="132" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">Rankings: actors and responsibility</text><rect x="24" y="175" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="200" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSL</text><text x="40" y="230" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">Landscapes: functions and evolution</text><rect x="452" y="175" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="468" y="200" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSM</text><text x="468" y="230" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">Models: supply, reuse and openness</text><path d="M226 159V275H156V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M226 159V275H724V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 159V280H156V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 159V280H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M226 257V285H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 257V290H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 257V290H724V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><rect x="24" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="40" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">01 / X1 · X3</text><text x="40" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Participation and</text><text x="40" y="401" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">growth</text><text x="40" y="438" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Connect real tasks,</text><text x="40" y="458" text-anchor="start" font-size="15" font-weight="400" fill="#587382">mentoring and role</text><text x="40" y="478" text-anchor="start" font-size="15" font-weight="400" fill="#587382">progression. Follow</text><text x="40" y="498" text-anchor="start" font-size="15" font-weight="400" fill="#587382">participant cohorts over</text><text x="40" y="518" text-anchor="start" font-size="15" font-weight="400" fill="#587382">time; open maintenance and</text><text x="40" y="538" text-anchor="start" font-size="15" font-weight="400" fill="#587382">decisions to people across</text><text x="40" y="558" text-anchor="start" font-size="15" font-weight="400" fill="#587382">regions and roles.</text><rect x="308" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="324" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">02 / X2 · X3</text><text x="324" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Maintainable, reusable</text><text x="324" y="401" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">foundations</text><text x="324" y="438" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Verify dependencies and</text><text x="324" y="458" text-anchor="start" font-size="15" font-weight="400" fill="#587382">maintenance owners. Support</text><text x="324" y="478" text-anchor="start" font-size="15" font-weight="400" fill="#587382">documentation, evaluation,</text><text x="324" y="498" text-anchor="start" font-size="15" font-weight="400" fill="#587382">adaptation and succession;</text><text x="324" y="518" text-anchor="start" font-size="15" font-weight="400" fill="#587382">record versions and upstream</text><text x="324" y="538" text-anchor="start" font-size="15" font-weight="400" fill="#587382">relationships for further</text><text x="324" y="558" text-anchor="start" font-size="15" font-weight="400" fill="#587382">use.</text><rect x="592" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="608" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">03 / X4</text><text x="608" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Governance &amp; public</text><text x="608" y="401" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">value</text><text x="608" y="438" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Publish rules, decisions and</text><text x="608" y="458" text-anchor="start" font-size="15" font-weight="400" fill="#587382">responsibilities. Examine</text><text x="608" y="478" text-anchor="start" font-size="15" font-weight="400" fill="#587382">delivery, use and outcomes</text><text x="608" y="498" text-anchor="start" font-size="15" font-weight="400" fill="#587382">separately, involving local</text><text x="608" y="518" text-anchor="start" font-size="15" font-weight="400" fill="#587382">users in defining needs and</text><text x="608" y="538" text-anchor="start" font-size="15" font-weight="400" fill="#587382">evaluating public value.</text><path d="M156 572C156 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M156 572C156 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M156 572C156 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><rect x="24" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.2</text><text x="40" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Public institutions</text><text x="40" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Provide sustained support</text><text x="40" y="753" text-anchor="start" font-size="16" font-weight="400" fill="#587382">and shared rules</text><text x="40" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Actions 01 · 02 · 03</text><rect x="308" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="324" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.3</text><text x="324" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Companies &amp; orgs</text><text x="324" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Connect use, releases and</text><text x="324" y="753" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance</text><text x="324" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Actions 04 · 05 · 06</text><rect x="592" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="608" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.4</text><text x="608" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Communities &amp; partners</text><text x="608" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Open participation paths</text><text x="608" y="753" text-anchor="start" font-size="16" font-weight="400" fill="#587382">and share maintenance</text><text x="608" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Actions 07 · 08 · 09</text><rect x="24" y="827" width="832" height="92" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="42" y="855" text-anchor="start" font-size="17" font-weight="400" fill="#18394c">Review together: define the population, baseline and period; record participation,</text><text x="42" y="881" text-anchor="start" font-size="17" font-weight="400" fill="#18394c">maintenance, use and outcomes. Adapt support using evidence so each round of action</text><text x="42" y="907" text-anchor="start" font-size="17" font-weight="400" fill="#18394c">enables further co-creation.</text><text x="440" y="959" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">Figure 6-1-1 Evidence, shared tasks and responsibilities</text><text x="440" y="987" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">Proposed pathways; lines do not encode quantity, weight or established causality.</text></g></svg>