<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1260" viewBox="0 0 880 1260" role="img"><title>Sustained co-creation and feedback</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1260" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">FROM PARTICIPATION TO FEEDBACK: RESPONSIBILITIES AND RECORDS</text><path d="M404 208.0H452" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M642 348V410" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M642 690V752" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M452 892.0H404" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M214 752V690" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M214 410V348" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><rect x="24" y="68" width="380" height="280" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="41" y="96" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">01</text><text x="79" y="96" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Participate</text><text x="41" y="127" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Enable more people to join</text><text x="41" y="179" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Tasks, tools, mentors and multilingual</text><text x="41" y="203" text-anchor="start" font-size="16" font-weight="400" fill="#587382">collaboration support participation.</text><text x="41" y="227" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Observe whether the same cohort</text><text x="41" y="251" text-anchor="start" font-size="16" font-weight="400" fill="#587382">continues contributing and takes on new</text><text x="41" y="275" text-anchor="start" font-size="16" font-weight="400" fill="#587382">responsibilities.</text><rect x="452" y="68" width="380" height="280" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="96" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">02</text><text x="507" y="96" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Contribute</text><text x="469" y="127" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Connect different kinds of work</text><text x="469" y="179" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Code, reviews, documentation,</text><text x="469" y="203" text-anchor="start" font-size="16" font-weight="400" fill="#587382">translation, tests and support all</text><text x="469" y="227" text-anchor="start" font-size="16" font-weight="400" fill="#587382">contribute to collaboration. Records</text><text x="469" y="251" text-anchor="start" font-size="16" font-weight="400" fill="#587382">make work visible; shared</text><text x="469" y="275" text-anchor="start" font-size="16" font-weight="400" fill="#587382">responsibilities help it continue.</text><rect x="452" y="410" width="380" height="280" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="438" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">03</text><text x="507" y="438" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Share open assets</text><text x="469" y="469" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Make versions and conditions clear</text><text x="469" y="521" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Code, models and data need clear</text><text x="469" y="545" text-anchor="start" font-size="16" font-weight="400" fill="#587382">versions, materials, licenses and</text><text x="469" y="569" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance contacts. Openness</text><text x="469" y="593" text-anchor="start" font-size="16" font-weight="400" fill="#587382">conditions help downstream users</text><text x="469" y="617" text-anchor="start" font-size="16" font-weight="400" fill="#587382">understand how to adopt and improve</text><text x="469" y="641" text-anchor="start" font-size="16" font-weight="400" fill="#587382">them.</text><rect x="452" y="752" width="380" height="280" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="780" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">04</text><text x="507" y="780" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Use and recreate</text><text x="469" y="811" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Connect one release to the next</text><text x="469" y="834" text-anchor="start" font-size="16" font-weight="400" fill="#156993">creation</text><text x="469" y="863" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Adoption, adaptation and derivation</text><text x="469" y="887" text-anchor="start" font-size="16" font-weight="400" fill="#587382">bring assets into new tasks. Retaining</text><text x="469" y="911" text-anchor="start" font-size="16" font-weight="400" fill="#587382">upstream relationships and versions</text><text x="469" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">creates a path for experience and</text><text x="469" y="959" text-anchor="start" font-size="16" font-weight="400" fill="#587382">improvements to return to shared</text><text x="469" y="983" text-anchor="start" font-size="16" font-weight="400" fill="#587382">foundations.</text><rect x="24" y="752" width="380" height="280" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="41" y="780" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">05</text><text x="79" y="780" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Public value</text><text x="41" y="811" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Examine actual use and outcomes</text><text x="41" y="863" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Start with public needs and concrete</text><text x="41" y="887" text-anchor="start" font-size="16" font-weight="400" fill="#587382">applications, then examine benefits and</text><text x="41" y="911" text-anchor="start" font-size="16" font-weight="400" fill="#587382">limits. Local users, implementers and</text><text x="41" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">researchers can provide evidence for</text><text x="41" y="959" text-anchor="start" font-size="16" font-weight="400" fill="#587382">the next round of improvements.</text><rect x="24" y="410" width="380" height="280" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="41" y="438" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">06</text><text x="79" y="438" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">Sustain support</text><text x="41" y="469" text-anchor="start" font-size="16" font-weight="400" fill="#156993">Return learning and resources to</text><text x="41" y="492" text-anchor="start" font-size="16" font-weight="400" fill="#156993">collaboration</text><text x="41" y="521" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Use maintenance needs and actual</text><text x="41" y="545" text-anchor="start" font-size="16" font-weight="400" fill="#587382">outcomes to refine resources, rules and</text><text x="41" y="569" text-anchor="start" font-size="16" font-weight="400" fill="#587382">participation opportunities. Support</text><text x="41" y="593" text-anchor="start" font-size="16" font-weight="400" fill="#587382">routine maintenance, succession and new</text><text x="41" y="617" text-anchor="start" font-size="16" font-weight="400" fill="#587382">public needs to enable the next cycle</text><text x="41" y="641" text-anchor="start" font-size="16" font-weight="400" fill="#587382">of co-creation.</text><text x="440" y="1124" text-anchor="middle" font-size="19" font-weight="600" fill="#156993">Sustained co-creation and its public value</text><text x="440" y="1159" text-anchor="middle" font-size="17" font-weight="400" fill="#587382">Maintenance sustains assets. Feedback improves action.</text><text x="440" y="1219" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">Figure 6-5-1 Sustained co-creation and feedback</text><text x="440" y="1247" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">Proposed pathways; lines do not encode quantity, weight or established causality.</text></g></svg>