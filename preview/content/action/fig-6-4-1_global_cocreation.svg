<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1060" viewBox="0 0 880 1060" role="img"><title>社区与全球伙伴的共同建设</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1060" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">实施步骤 → 协作分工 → 后续观察</text><rect x="24" y="50" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">07  让新人走向共同维护者</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">持续参与与人才成长</text><rect x="40" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  找到第一个任务</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">任务边界清楚，文档和求助入口</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">易于找到。</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">社区维护者</text><text x="40" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">开放规则和任务</text><text x="40" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">入口是否可用</text><rect x="316" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  参与共同评审</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">导师与协作者共同给出反馈，认</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">可不同贡献。</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">导师与伙伴</text><text x="316" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">提供持续反馈</text><text x="316" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">参与是否延续</text><rect x="592" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  接续维护责任</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">公开角色成长与交接规则，减少</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">对少数人的依赖。</text><text x="592" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">新参与者</text><text x="592" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">完成任务并逐步接续</text><text x="592" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">角色是否开放</text><rect x="24" y="370" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="397" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">08  围绕共同依赖组织跨地区维护</text><text x="40" y="423" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">可维护、可复用的基础</text><rect x="40" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  找到共同需求</text><text x="52" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">沿真实依赖和复用关系联系维护</text><text x="52" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">者与使用方。</text><path d="M290 498H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">上游维护者</text><text x="40" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">说明基础能力与维护需求</text><text x="40" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">共同任务</text><rect x="316" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  约定共同任务</text><text x="328" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同确定适配、评测和维护任</text><text x="328" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">务，让本地伙伴参与决策。</text><path d="M566 498H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">下游与本地伙伴</text><text x="316" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同适配并反馈经验</text><text x="316" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">改进回流</text><rect x="592" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  延续合作记录</text><text x="604" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">让改进回到上游，保留版本和接</text><text x="604" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">续维护记录。</text><text x="592" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">合作支持方</text><text x="592" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">帮助资源与分工延续</text><text x="592" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">维护延续</text><rect x="24" y="690" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="717" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">09  让公共需求进入共同设计与治理</text><text x="40" y="743" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">透明治理与公共价值</text><rect x="40" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  共同定义问题</text><text x="52" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">让本地伙伴与使用者参与需求和</text><text x="52" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">评价设计。</text><path d="M290 818H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">本地伙伴与使用者</text><text x="40" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">提出需求并参与评价</text><text x="40" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">谁在参与</text><rect x="316" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  公开协作与决策</text><text x="328" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">记录适配工作、重要决策与维护</text><text x="328" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">责任。</text><path d="M566 818H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">社区与实施团队</text><text x="316" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同适配和持续维护</text><text x="316" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">谁在受益</text><rect x="592" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  把结果带回项目</text><text x="604" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">复核真实使用与结果，把改进用</text><text x="604" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">于下一轮创造。</text><text x="592" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">研究与支持机构</text><text x="592" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">帮助记录与复核结果</text><text x="592" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">经验是否延续</text><text x="440" y="1019" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">图 6-4-1 社区与全球伙伴的共同建设</text><text x="440" y="1047" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">前文证据与行动建议的关系示意；连线不表示数量、权重或已验证的因果关系。</text></g></svg>