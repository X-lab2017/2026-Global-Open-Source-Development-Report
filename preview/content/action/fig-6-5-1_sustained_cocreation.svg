<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>让一次创造，连接下一次创造</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-5-1 / SUSTAINED CO-CREATION</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">让一次创造，连接下一次创造</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">维护让成果延续，反馈让行动改进。</text><path d="M760 182C890 182 1068 195 1068 244" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M1068 328V454" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M948 496C860 550 830 600 760 600" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M520 600C420 600 340 545 332 496" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M212 454V328" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M332 286C430 202 446 182 520 182" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><rect x="520" y="140" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="537" y="171" font-size="20" font-weight="600" fill="#18394c">持续参与</text><text x="537" y="197" font-size="12" font-weight="400" fill="#587382">让更多人能够加入</text><rect x="948" y="244" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="965" y="275" font-size="20" font-weight="600" fill="#18394c">共同贡献</text><text x="965" y="301" font-size="12" font-weight="400" fill="#587382">让不同工作得到连接</text><rect x="948" y="454" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="965" y="485" font-size="20" font-weight="600" fill="#18394c">开放成果</text><text x="965" y="511" font-size="12" font-weight="400" fill="#587382">让版本与条件清楚</text><rect x="520" y="558" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="537" y="589" font-size="20" font-weight="600" fill="#18394c">采用与再创造</text><text x="537" y="615" font-size="12" font-weight="400" fill="#587382">让一次发布连接下一次创造</text><rect x="92" y="454" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="109" y="485" font-size="20" font-weight="600" fill="#18394c">公共价值</text><text x="109" y="511" font-size="12" font-weight="400" fill="#587382">让真实使用与结果可验证</text><rect x="92" y="244" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="109" y="275" font-size="20" font-weight="600" fill="#18394c">持续支持</text><text x="109" y="301" font-size="12" font-weight="400" fill="#587382">让经验与资源回到共建</text><text x="490" y="350" font-size="13" font-weight="600" fill="#156993">CO-CREATION</text><text x="430" y="394" font-size="30" font-weight="600" fill="#18394c">持续共同创造及其公共价值</text><rect x="28" y="660" width="1224" height="90" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="50" y="695" font-size="20" font-weight="600" fill="#18394c">共同承担，持续检验</text><text x="50" y="725" font-size="17" font-weight="400" fill="#587382">把真实使用与结果带回下一轮支持，让共同创造能够不断延续。</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">行动路径示意 · 连线不表示数量、权重或已经验证的因果关系。</text></g></svg>