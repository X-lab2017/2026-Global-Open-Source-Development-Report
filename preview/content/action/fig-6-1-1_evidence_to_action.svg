<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img"><title>证据、共同任务与主体责任</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1000" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">前五章证据 → 三项共同任务 → 主体分工</text><text x="24" y="57" text-anchor="start" font-size="16" font-weight="400" fill="#587382">价值起点：第一章的持续共同创造及其公共价值</text><rect x="24" y="77" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="102" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSO</text><text x="40" y="132" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">生态地图：参与与平台覆盖</text><rect x="452" y="77" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="468" y="102" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSR</text><text x="468" y="132" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">影响力榜：主体与责任</text><rect x="24" y="175" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="200" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSL</text><text x="40" y="230" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">技术全景：功能与演进</text><rect x="452" y="175" width="404" height="82" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="468" y="200" text-anchor="start" font-size="14.5" font-weight="600" fill="#156993">GOSM</text><text x="468" y="230" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">模型生态：供给、复用与开放</text><path d="M226 159V275H156V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M226 159V275H724V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 159V280H156V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 159V280H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M226 257V285H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 257V290H440V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><path d="M654 257V290H724V316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#arrow)"/><rect x="24" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="40" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">01 / X1 · X3</text><text x="40" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">持续参与与人才成长</text><text x="40" y="438" text-anchor="start" font-size="16" font-weight="400" fill="#587382">把参与入口连接到真实任务、导</text><text x="40" y="462" text-anchor="start" font-size="16" font-weight="400" fill="#587382">师反馈和角色成长。跟踪同一批</text><text x="40" y="486" text-anchor="start" font-size="16" font-weight="400" fill="#587382">参与者能否持续贡献，让不同地</text><text x="40" y="510" text-anchor="start" font-size="16" font-weight="400" fill="#587382">区与不同贡献角色都有机会进入</text><text x="40" y="534" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同维护和决策。</text><rect x="308" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="324" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">02 / X2 · X3</text><text x="324" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">可维护、可复用的基础</text><text x="324" y="438" text-anchor="start" font-size="16" font-weight="400" fill="#587382">沿实际依赖确认维护责任，把文</text><text x="324" y="462" text-anchor="start" font-size="16" font-weight="400" fill="#587382">档、测试、评测、适配和人员接</text><text x="324" y="486" text-anchor="start" font-size="16" font-weight="400" fill="#587382">续纳入支持。清楚记录版本与上</text><text x="324" y="510" text-anchor="start" font-size="16" font-weight="400" fill="#587382">游关系，让后续创造能够复核条</text><text x="324" y="534" text-anchor="start" font-size="16" font-weight="400" fill="#587382">件、反馈改进。</text><rect x="592" y="318" width="264" height="254" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="608" y="344" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">03 / X4</text><text x="608" y="375" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">透明治理与公共价值</text><text x="608" y="438" text-anchor="start" font-size="16" font-weight="400" fill="#587382">公开参与规则、重要决策和责任</text><text x="608" y="462" text-anchor="start" font-size="16" font-weight="400" fill="#587382">安排；分别核查开放交付、实际</text><text x="608" y="486" text-anchor="start" font-size="16" font-weight="400" fill="#587382">采用与使用结果。让本地使用者</text><text x="608" y="510" text-anchor="start" font-size="16" font-weight="400" fill="#587382">参与问题定义和评价，逐步积累</text><text x="608" y="534" text-anchor="start" font-size="16" font-weight="400" fill="#587382">可验证的公共价值证据。</text><path d="M156 572C156 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M156 572C156 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M156 572C156 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M440 572C440 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 156 608 156 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 440 608 440 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><path d="M724 572C724 602 724 608 724 638" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.24" marker-end="url(#arrow)"/><rect x="24" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.2</text><text x="40" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">公共部门</text><text x="40" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">提供长期支持与共同规则</text><text x="40" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">建议 01 · 02 · 03</text><rect x="308" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="324" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.3</text><text x="324" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">企业与组织</text><text x="324" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">把使用、发布与维护接起来</text><text x="324" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">建议 04 · 05 · 06</text><rect x="592" y="640" width="264" height="154" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="608" y="667" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">6.4</text><text x="608" y="699" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">社区与伙伴</text><text x="608" y="730" text-anchor="start" font-size="16" font-weight="400" fill="#587382">开放参与路径，组织共同维护</text><text x="608" y="779" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">建议 07 · 08 · 09</text><rect x="24" y="827" width="832" height="92" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="42" y="855" text-anchor="start" font-size="17" font-weight="400" fill="#18394c">共同复盘：先明确对象、起点与观察周期，再持续记录参与、维护、使用与结果。根据证据调整支持，让</text><text x="42" y="881" text-anchor="start" font-size="17" font-weight="400" fill="#18394c">每一轮行动成为下一轮共同创造的基础。</text><text x="440" y="959" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">图 6-1-1 证据、共同任务与主体责任</text><text x="440" y="987" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">前文证据与行动建议的关系示意；连线不表示数量、权重或已验证的因果关系。</text></g></svg>