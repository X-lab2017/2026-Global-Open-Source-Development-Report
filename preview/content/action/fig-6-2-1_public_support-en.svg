<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>Connect public support to sustained collaboration</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-2-1 / ACTION OVERVIEW</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">Connect public support to sustained collaboration</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">Three recommendations · Explore steps, responsibilities and observations in the interactive edition.</text><text x="28" y="163" font-size="13" font-weight="600" fill="#156993">RECOMMENDATION</text><text x="420" y="163" font-size="13" font-weight="600" fill="#156993">IMPLEMENTATION PATH</text><text x="938" y="163" font-size="13" font-weight="600" fill="#156993">WHAT TO OBSERVE</text><rect x="28" y="187" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="216" font-size="12" font-weight="400" fill="#156993">01 / Maintainable, reusable foundations</text><text x="48" y="257" font-size="22" font-weight="600" fill="#18394c">Extend public support to</text><text x="48" y="288" font-size="22" font-weight="600" fill="#18394c">long-term maintenance</text><path d="M378 262H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="187" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="223" font-size="17" font-weight="400" fill="#18394c">1 Identify shared dependencies</text><text x="440" y="266" font-size="17" font-weight="400" fill="#18394c">2 Agree on sustained support</text><text x="440" y="309" font-size="17" font-weight="400" fill="#18394c">3 Review maintenance changes</text><path d="M890 262H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="187" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="223" font-size="17" font-weight="400" fill="#18394c">Clear ownership</text><text x="958" y="266" font-size="17" font-weight="400" fill="#18394c">Continuity of support</text><text x="958" y="309" font-size="17" font-weight="400" fill="#18394c">User-facing improvements</text><rect x="28" y="361" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="390" font-size="12" font-weight="400" fill="#156993">02 / Participation and growth</text><text x="48" y="431" font-size="22" font-weight="600" fill="#18394c">Connect talent support</text><text x="48" y="462" font-size="22" font-weight="600" fill="#18394c">to real shared work</text><path d="M378 436H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="361" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="397" font-size="17" font-weight="400" fill="#18394c">1 Open real tasks</text><text x="440" y="440" font-size="17" font-weight="400" fill="#18394c">2 Provide participation support</text><text x="440" y="483" font-size="17" font-weight="400" fill="#18394c">3 Observe subsequent growth</text><path d="M890 436H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="361" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="397" font-size="17" font-weight="400" fill="#18394c">Continued participation</text><text x="958" y="440" font-size="17" font-weight="400" fill="#18394c">Role development</text><text x="958" y="483" font-size="17" font-weight="400" fill="#18394c">Lasting partnerships</text><rect x="28" y="535" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="564" font-size="12" font-weight="400" fill="#156993">03 / Governance &amp; public value</text><text x="48" y="605" font-size="22" font-weight="600" fill="#18394c">Review open deliverables</text><text x="48" y="636" font-size="22" font-weight="600" fill="#18394c">and public outcomes</text><text x="48" y="667" font-size="22" font-weight="600" fill="#18394c">separately</text><path d="M378 610H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="535" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="571" font-size="17" font-weight="400" fill="#18394c">1 Define the public need</text><text x="440" y="614" font-size="17" font-weight="400" fill="#18394c">2 Record versioned deliverables</text><text x="440" y="657" font-size="17" font-weight="400" fill="#18394c">3 Examine use and outcomes</text><path d="M890 610H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="535" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="571" font-size="17" font-weight="400" fill="#18394c">Inspectable deliverables</text><text x="958" y="614" font-size="17" font-weight="400" fill="#18394c">Actual use</text><text x="958" y="657" font-size="17" font-weight="400" fill="#18394c">Verifiable outcomes</text><text x="28" y="750" font-size="14" font-weight="400" fill="#587382">The three shared tasks cut across actors. Adapt implementation to project needs and local context.</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">Action pathways · Lines do not encode quantities, weights or established causal effects.</text></g></svg>