<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1360" viewBox="0 0 880 1360" role="img"><title>Three pathways for public support</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1360" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">STEPS → RESPONSIBILITIES → FOLLOW-UP</text><rect x="24" y="50" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">01  Extend public support to long-term maintenance</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Maintainable, reusable foundations</text><rect x="40" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Identify shared</text><text x="52" y="167" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">dependencies</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Use actual usage and</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance records to</text><text x="52" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">identify project</text><text x="52" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">boundaries and support</text><text x="52" y="281" text-anchor="start" font-size="16" font-weight="400" fill="#587382">gaps.</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Public funders · Arrange</text><text x="40" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">sustained support</text><text x="40" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Clear ownership</text><rect x="316" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Agree on sustained</text><text x="328" y="167" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">support</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Specify maintenance work,</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">accountable teams,</text><text x="328" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">support periods and</text><text x="328" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">handovers.</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Foundations and users ·</text><text x="316" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Validate needs and share</text><text x="316" y="372" text-anchor="start" font-size="15" font-weight="400" fill="#587382">support</text><text x="316" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Continuity of support</text><rect x="592" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Review maintenance</text><text x="604" y="167" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">changes</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Use workload and user</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">feedback to continue,</text><text x="604" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">adjust or wind down</text><text x="604" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">support.</text><text x="592" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Maintainer teams · Record work</text><text x="592" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">and succession</text><text x="592" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">User-facing improvements</text><rect x="24" y="470" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="497" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">02  Connect talent support to real shared work</text><text x="40" y="523" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Participation and growth</text><rect x="40" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Open real tasks</text><text x="52" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Connect teaching and</text><text x="52" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">partnership needs to</text><text x="52" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">accessible projects.</text><path d="M290 598H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Regions and international</text><text x="40" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">organizations · Connect</text><text x="40" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">regional nodes and Global</text><text x="40" y="814" text-anchor="start" font-size="15" font-weight="400" fill="#587382">South partners</text><text x="40" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Continued participation</text><rect x="316" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Provide participation</text><text x="328" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">support</text><text x="328" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Provide mentors,</text><text x="328" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">documentation, tools and</text><text x="328" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">multilingual</text><text x="328" y="679" text-anchor="start" font-size="16" font-weight="400" fill="#587382">collaboration.</text><path d="M566 598H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Universities and companies ·</text><text x="316" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Open tasks and provide mentors</text><text x="316" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Role development</text><rect x="592" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Observe subsequent</text><text x="604" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">growth</text><text x="604" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Follow defined cohorts:</text><text x="604" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">continued contributions,</text><text x="604" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">role changes and reasons</text><text x="604" y="679" text-anchor="start" font-size="16" font-weight="400" fill="#587382">for leaving.</text><text x="592" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Communities and learners ·</text><text x="592" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Build and maintain shared</text><text x="592" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">outputs</text><text x="592" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Lasting partnerships</text><rect x="24" y="890" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="917" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">03  Review open deliverables and public outcomes separately</text><text x="40" y="943" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Governance &amp; public value</text><rect x="40" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Define the public need</text><text x="52" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Implementers and intended</text><text x="52" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">users jointly define the</text><text x="52" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">problem and observation</text><text x="52" y="1099" text-anchor="start" font-size="16" font-weight="400" fill="#587382">scope.</text><path d="M290 1018H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Public funders · Define</text><text x="40" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">delivery and evaluation needs</text><text x="40" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Inspectable deliverables</text><rect x="316" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Record versioned</text><text x="328" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">deliverables</text><text x="328" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Record open materials,</text><text x="328" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">license information,</text><text x="328" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance and changes</text><text x="328" y="1099" text-anchor="start" font-size="16" font-weight="400" fill="#587382">item by item.</text><path d="M566 1018H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Publishers and implementers ·</text><text x="316" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Keep version and usage records</text><text x="316" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Actual use</text><rect x="592" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Examine use and</text><text x="604" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">outcomes</text><text x="604" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Document actual</text><text x="604" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">deployment and outcomes,</text><text x="604" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">including scope and</text><text x="604" y="1099" text-anchor="start" font-size="16" font-weight="400" fill="#587382">unknowns.</text><text x="592" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Local partners and researchers</text><text x="592" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">· Examine outcomes together</text><text x="592" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Verifiable outcomes</text><text x="440" y="1319" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">Figure 6-2-1 Three pathways for public support</text><text x="440" y="1347" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">Proposed pathways; lines do not encode quantity, weight or established causality.</text></g></svg>