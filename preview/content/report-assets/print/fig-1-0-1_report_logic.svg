<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img"><title>六章，一条清晰的阅读路径</title><rect width="640" height="840" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="0" y="18" font-size="14" fill="#087984" text-anchor="start">图 1-0-1 / READING THE REPORT</text><text x="0" y="61" font-size="28" fill="#18394c" text-anchor="start">六章，一条清晰的阅读路径</text><text x="0" y="91" font-size="15" fill="#4d6573" text-anchor="start">共同目标组织观察，研究证据连接行动。</text><rect x="0" y="120" width="640" height="130" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="22" y="149" font-size="15" fill="#087984" text-anchor="start">第一章 / 建立共同基础</text><text x="22" y="185" font-size="24" fill="#18394c" text-anchor="start">从开放协作到公共价值</text><text x="22" y="218" font-size="16" fill="#4d6573" text-anchor="start">1.1 共同创新与公共价值 · 1.2 OSDGs · 1.3 OSDI</text><path d="M320 250 L320 281" fill="none" stroke="#087984" stroke-width="2"/><path d="M315 274 L320 281 L325 274" fill="none" stroke="#087984" stroke-width="2"/><text x="0" y="307" font-size="18" fill="#18394c" text-anchor="start">第二至第五章 / 四个互补观察视角</text><rect x="0" y="330" width="308" height="128" rx="5" fill="#ffffff" stroke="#a9bbc4"/><path d="M1 331 L307 331" fill="none" stroke="#087984" stroke-width="3"/><text x="18" y="360" font-size="16" fill="#087984" text-anchor="start">第二章 · GOSO</text><text x="18" y="395" font-size="18" fill="#18394c" text-anchor="start">全球开源生态观测地图</text><text x="18" y="423" font-size="14" fill="#4d6573" text-anchor="start">参与、贡献与开放资产，在哪里积累？</text><rect x="332" y="330" width="308" height="128" rx="5" fill="#ffffff" stroke="#a9bbc4"/><path d="M333 331 L639 331" fill="none" stroke="#76508b" stroke-width="3"/><text x="350" y="360" font-size="16" fill="#76508b" text-anchor="start">第三章 · GOSR</text><text x="350" y="395" font-size="18" fill="#18394c" text-anchor="start">全球开源影响力排行榜</text><text x="350" y="423" font-size="14" fill="#4d6573" text-anchor="start">哪些地区、组织与项目形成关键影响？</text><rect x="0" y="477" width="308" height="128" rx="5" fill="#ffffff" stroke="#a9bbc4"/><path d="M1 478 L307 478" fill="none" stroke="#2d5f9f" stroke-width="3"/><text x="18" y="507" font-size="16" fill="#2d5f9f" text-anchor="start">第四章 · GOSL</text><text x="18" y="542" font-size="18" fill="#18394c" text-anchor="start">全球开源技术全景洞察</text><text x="18" y="570" font-size="14" fill="#4d6573" text-anchor="start">技术如何分类，各领域怎样演进？</text><rect x="332" y="477" width="308" height="128" rx="5" fill="#ffffff" stroke="#a9bbc4"/><path d="M333 478 L639 478" fill="none" stroke="#407a51" stroke-width="3"/><text x="350" y="507" font-size="16" fill="#407a51" text-anchor="start">第五章 · GOSM</text><text x="350" y="542" font-size="18" fill="#18394c" text-anchor="start">全球开源大模型发展洞察</text><text x="350" y="570" font-size="14" fill="#4d6573" text-anchor="start">模型由谁供给，怎样复用与开放？</text><path d="M320 612 L320 644" fill="none" stroke="#087984" stroke-width="2"/><path d="M315 637 L320 644 L325 637" fill="none" stroke="#087984" stroke-width="2"/><rect x="0" y="660" width="640" height="113" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="22" y="689" font-size="15" fill="#087984" text-anchor="start">第六章 / 从研究走向行动</text><text x="22" y="724" font-size="24" fill="#18394c" text-anchor="start">未来展望与行动建议</text><text x="22" y="754" font-size="16" fill="#4d6573" text-anchor="start">三项共同任务 · 九条主体建议</text><text x="0" y="812" font-size="14" fill="#4d6573" text-anchor="start">阅读提示：四个研究视角相互补充；连线表示篇章联系，不代表评分权重。</text></g></svg>