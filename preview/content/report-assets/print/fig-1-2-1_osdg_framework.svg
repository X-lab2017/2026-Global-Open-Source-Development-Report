<svg xmlns="http://www.w3.org/2000/svg" width="640" height="577" viewBox="0 0 640 577" role="img"><title>OSDGs 四大支柱与十个维度</title><rect width="640" height="577" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect x="0" y="7" width="308" height="248" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 8 L307 8" fill="none" stroke="#087984" stroke-width="2"/><text x="14" y="32" font-size="14" fill="#087984" text-anchor="start">X1  人才规模与多样性</text><text x="14" y="56" font-size="12" fill="#4d6573" text-anchor="start">谁能参与，怎样持续成长？</text><text x="14" y="90" font-size="13" fill="#18394c" text-anchor="start">1.1  规模与密度</text><text x="14" y="110" font-size="11.8" fill="#4d6573" text-anchor="start">参与有多广，人才如何分布？</text><text x="14" y="147" font-size="13" fill="#18394c" text-anchor="start">1.2  生态多样性</text><text x="14" y="167" font-size="11.8" fill="#4d6573" text-anchor="start">参与者从哪里来，如何跨边界协作？</text><rect x="332" y="7" width="308" height="248" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M333 8 L639 8" fill="none" stroke="#2d5f9f" stroke-width="2"/><text x="346" y="32" font-size="14" fill="#2d5f9f" text-anchor="start">X2  技术产出与开放供给</text><text x="346" y="56" font-size="12" fill="#4d6573" text-anchor="start">有哪些可用、可复用的成果？</text><text x="346" y="90" font-size="13" fill="#18394c" text-anchor="start">2.1  代码产出</text><text x="346" y="110" font-size="11.8" fill="#4d6573" text-anchor="start">协作怎样形成持续的软件产出？</text><text x="346" y="147" font-size="13" fill="#18394c" text-anchor="start">2.2  模型开放供给</text><text x="346" y="167" font-size="11.8" fill="#4d6573" text-anchor="start">有哪些模型供给，来自怎样的发布方？</text><text x="346" y="204" font-size="13" fill="#18394c" text-anchor="start">2.3  数据开放供给</text><text x="346" y="224" font-size="11.8" fill="#4d6573" text-anchor="start">开放数据供给是否充分且多样？</text><rect x="0" y="272" width="308" height="248" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 273 L307 273" fill="none" stroke="#76508b" stroke-width="2"/><text x="14" y="297" font-size="14" fill="#76508b" text-anchor="start">X3  全球连接与网络效应</text><text x="14" y="321" font-size="12" fill="#4d6573" text-anchor="start">贡献与成果怎样形成影响？</text><text x="14" y="355" font-size="13" fill="#18394c" text-anchor="start">3.1  代码影响力</text><text x="14" y="375" font-size="11.8" fill="#4d6573" text-anchor="start">代码贡献如何形成生态影响？</text><text x="14" y="412" font-size="13" fill="#18394c" text-anchor="start">3.2  模型影响力</text><text x="14" y="432" font-size="11.8" fill="#4d6573" text-anchor="start">模型如何被采用、讨论和进一步派生？</text><text x="14" y="469" font-size="13" fill="#18394c" text-anchor="start">3.3  数据集影响力</text><text x="14" y="489" font-size="11.8" fill="#4d6573" text-anchor="start">数据如何被采用，并支持后续复用？</text><rect x="332" y="272" width="308" height="248" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M333 273 L639 273" fill="none" stroke="#407a51" stroke-width="2"/><text x="346" y="297" font-size="14" fill="#407a51" text-anchor="start">X4  开源善治与公共价值</text><text x="346" y="321" font-size="12" fill="#4d6573" text-anchor="start">协作如何持续，价值如何实现？</text><text x="346" y="355" font-size="13" fill="#18394c" text-anchor="start">4.1  治理成熟度</text><text x="346" y="375" font-size="11.8" fill="#4d6573" text-anchor="start">谁参与治理，哪些规则有据可查？</text><text x="346" y="412" font-size="13" fill="#18394c" text-anchor="start">4.2  公共福祉</text><text x="346" y="432" font-size="11.8" fill="#4d6573" text-anchor="start">开放技术如何面向公共利益？</text><text x="320" y="572" font-size="13" fill="#18394c" text-anchor="middle">图 1-2-1  OSDGs 四大支柱与十个维度</text></g></svg>