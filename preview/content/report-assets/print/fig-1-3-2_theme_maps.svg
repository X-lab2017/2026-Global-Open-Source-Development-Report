="11.5" fill="#4d6573" text-anchor="start">参与规模 · 地域分布 · 变化趋势</text><rect x="274" y="92" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="113" font-size="13" fill="#087984" text-anchor="start">2.2  C-Map  贡献</text><text x="287" y="132" font-size="11.5" fill="#4d6573" text-anchor="start">贡献来源 · 贡献强度 · 协作联系</text><rect x="274" y="149" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="170" font-size="13" fill="#087984" text-anchor="start">2.3  I-Map  项目影响力</text><text x="287" y="189" font-size="11.5" fill="#4d6573" text-anchor="start">影响分布 · 项目结构 · 时间变化</text><rect x="274" y="206" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="227" font-size="13" fill="#087984" text-anchor="start">2.4  T-Map  人才</text><text x="287" y="246" font-size="11.5" fill="#4d6573" text-anchor="start">人才聚集 · 成长轨迹 · 全球连接</text><rect x="274" y="263" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="284" font-size="13" fill="#087984" text-anchor="start">2.5  A-Map  资产</text><text x="287" y="303" font-size="11.5" fill="#4d6573" text-anchor="start">代码 · 模型 · 数据</text><rect x="274" y="320" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="341" font-size="13" fill="#087984" text-anchor="start">2.6  D-Map  多样性</text><text x="287" y="360" font-size="11.5" fill="#4d6573" text-anchor="start">参与结构 · 跨域协作 · 开放连接</text><rect x="274" y="377" width="366" height="50" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="287" y="398" font-size="13" fill="#087984" text-anchor="start">2.7  G-Map  治理与社会公益</text><text x="287" y="417" font-size="11.5" fill="#4d6573" text-anchor="start">治理实践 · 开放条件 · 公共价值</text><text x="0" y="455" font-size="11.8" fill="#4d6573" text-anchor="start">连线表示阅读与研究联系，不代表计算权重。</text><text x="320" y="503" font-size="13" fill="#18394c" text-anchor="middle">图 1-3-2  从四大支柱到七个主题地图</text></g></svg>