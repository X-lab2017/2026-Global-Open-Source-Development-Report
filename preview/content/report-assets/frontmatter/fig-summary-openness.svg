<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img"><title>开放条件与公共价值的观察边界</title><rect width="640" height="212" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect x="0" y="7" width="200" height="128" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="100" y="35" font-size="13" fill="#407a51" text-anchor="middle">获得什么</text><text x="14" y="65" font-size="12" fill="#18394c" text-anchor="start">权重、代码、数据说明等材料</text><rect x="220" y="7" width="200" height="128" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="320" y="35" font-size="13" fill="#407a51" text-anchor="middle">允许什么</text><text x="234" y="65" font-size="12" fill="#18394c" text-anchor="start">具体版本的许可与使用条件</text><rect x="440" y="7" width="200" height="128" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="540" y="35" font-size="13" fill="#407a51" text-anchor="middle">带来什么</text><text x="454" y="65" font-size="12" fill="#18394c" text-anchor="start">实际采用、受益人群与维护记录</text><text x="0" y="158" font-size="11.3" fill="#4d6573" text-anchor="start">解释框架，非等级或得分；完整分级说明见 5.3，公共应用与治理见 2.7。</text><text x="320" y="207" font-size="13" fill="#18394c" text-anchor="middle">图 摘-4  开放条件与公共价值的观察边界</text></g></svg>