<svg xmlns="http://www.w3.org/2000/svg" width="640" height="433" viewBox="0 0 640 433" role="img"><title>宣言的共同愿景、七项原则与行动方向</title><rect width="640" height="433" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect x="0" y="6" width="640" height="70" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="320" y="30" font-size="14" fill="#18394c" text-anchor="middle">全球开源与人工智能国际合作宣言</text><text x="320" y="56" font-size="12" fill="#4d6573" text-anchor="middle">时代呼唤 → 共同愿景：开放、包容、安全、可持续</text><path d="M320 76 L320 91 L100 91 L100 108" fill="none" stroke="#087984" stroke-width="1.1"/><rect x="0" y="108" width="200" height="195" rx="5" fill="#f2f6f7" stroke="#087984"/><text x="100" y="132" font-size="13" fill="#087984" text-anchor="middle">筑牢智能时代基石</text><text x="100" y="166" font-size="13" fill="#18394c" text-anchor="middle">01  坚持开放互联</text><text x="100" y="186" font-size="11.5" fill="#4d6573" text-anchor="middle">万物智联，普惠共生</text><text x="100" y="220" font-size="13" fill="#18394c" text-anchor="middle">02  坚持安全可信</text><text x="100" y="240" font-size="11.5" fill="#4d6573" text-anchor="middle">透明算法，信任基石</text><path d="M100 303 L100 319 L320 319 L320 333" fill="none" stroke="#087984" stroke-width="1.1"/><path d="M320 76 L320 91 L320 91 L320 108" fill="none" stroke="#2d5f9f" stroke-width="1.1"/><rect x="220" y="108" width="200" height="195" rx="5" fill="#f2f6f7" stroke="#2d5f9f"/><text x="320" y="132" font-size="13" fill="#2d5f9f" text-anchor="middle">夯实伦理治理支柱</text><text x="320" y="166" font-size="13" fill="#18394c" text-anchor="middle">03  坚持数据伦理</text><text x="320" y="186" font-size="11.5" fill="#4d6573" text-anchor="middle">算法向善，责任共担</text><text x="320" y="220" font-size="13" fill="#18394c" text-anchor="middle">04  坚持多元包容</text><text x="320" y="240" font-size="11.5" fill="#4d6573" text-anchor="middle">众智共创，价值共享</text><text x="320" y="274" font-size="13" fill="#18394c" text-anchor="middle">05  坚持全球协作</text><text x="320" y="294" font-size="11.5" fill="#4d6573" text-anchor="middle">跨界协同，智能互联</text><path d="M320 303 L320 319 L320 319 L320 333" fill="none" stroke="#2d5f9f" stroke-width="1.1"/><path d="M320 76 L320 91 L540 91 L540 108" fill="none" stroke="#407a51" stroke-width="1.1"/><rect x="440" y="108" width="200" height="195" rx="5" fill="#f2f6f7" stroke="#407a51"/><text x="540" y="132" font-size="13" fill="#407a51" text-anchor="middle">共创社会价值未来</text><text x="540" y="166" font-size="13" fill="#18394c" text-anchor="middle">06  坚持绿色智能</text><text x="540" y="186" font-size="11.5" fill="#4d6573" text-anchor="middle">低碳驱动，创新致远</text><text x="540" y="220" font-size="13" fill="#18394c" text-anchor="middle">07  坚持开源普惠</text><text x="540" y="240" font-size="11.5" fill="#4d6573" text-anchor="middle">智能为公，成果共享</text><path d="M540 303 L540 319 L320 319 L320 333" fill="none" stroke="#407a51" stroke-width="1.1"/><rect x="0" y="333" width="640" height="48" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="320" y="353" font-size="13" fill="#18394c" text-anchor="middle">行动共识：政府、企业、学界与公民社会携手</text><text x="320" y="371" font-size="11.5" fill="#4d6573" text-anchor="middle">深化 AI 治理、算力共享与人才培育合作</text><text x="320" y="428" font-size="13" fill="#18394c" text-anchor="middle">图 引-1  宣言的共同愿景、七项原则与行动方向</text></g></svg>