<svg xmlns="http://www.w3.org/2000/svg" width="640" height="212" viewBox="0 0 640 212" role="img"><title>模型与发布账号的快照回溯</title><rect width="640" height="212" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="0" y="16" font-size="12" fill="#4d6573" text-anchor="start">当前快照内，按创建时间回溯</text><text x="0" y="42" font-size="14" fill="#18394c" text-anchor="start">模型</text><text x="310" y="42" font-size="14" fill="#76508b" text-anchor="end">+58.3%</text><text x="0" y="71" font-size="11.5" fill="#4d6573" text-anchor="start">2025-09-13</text><rect x="82" y="62" width="88.45666514270783" height="8" rx="0" fill="#b6a7c4" stroke="#76508b"/><text x="310" y="71" font-size="12" fill="#18394c" text-anchor="end">193.48 万</text><text x="0" y="103" font-size="11.5" fill="#4d6573" text-anchor="start">2026-09-13</text><rect x="82" y="94" width="140.0" height="8" rx="0" fill="#76508b" stroke="#76508b"/><text x="310" y="103" font-size="12" fill="#18394c" text-anchor="end">306.22 万</text><text x="330" y="42" font-size="14" fill="#18394c" text-anchor="start">发布账号</text><text x="640" y="42" font-size="14" fill="#76508b" text-anchor="end">+48.4%</text><text x="330" y="71" font-size="11.5" fill="#4d6573" text-anchor="start">2025-09-13</text><rect x="412" y="62" width="94.32251752812654" height="8" rx="0" fill="#b6a7c4" stroke="#76508b"/><text x="640" y="71" font-size="12" fill="#18394c" text-anchor="end">41.32 万</text><text x="330" y="103" font-size="11.5" fill="#4d6573" text-anchor="start">2026-09-13</text><rect x="412" y="94" width="140.0" height="8" rx="0" fill="#76508b" stroke="#76508b"/><text x="640" y="103" font-size="12" fill="#18394c" text-anchor="end">61.33 万</text><text x="0" y="129" font-size="11.5" fill="#4d6573" text-anchor="start">每组按本期数量分别缩放。</text><text x="0" y="158" font-size="11.3" fill="#4d6573" text-anchor="start">2026-09-13 快照，按创建时间回溯上年同日；仅含快照时仍可见的资产与发布账号，非历年独立存档。</text><text x="320" y="207" font-size="13" fill="#18394c" text-anchor="middle">图 摘-3