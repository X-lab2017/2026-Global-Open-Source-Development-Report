<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#f8fbfc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183a4b"><text x="28" y="46" font-size="14" fill="#237b89" font-weight="600">GOSO / SEVEN THEMATIC MAPS</text><text x="28" y="94" font-size="32" fill="#183a4b" font-weight="600">从发展目标，走进七个主题地图</text><text x="28" y="127" font-size="17" fill="#56717d" font-weight="400">四大支柱交叉连接七个观察主题，共同理解开放协作与公共价值。</text><text x="28" y="178" font-size="13" fill="#56717d" font-weight="400">发展目标 · OSDGs</text><text x="468" y="153" font-size="13" fill="#56717d" font-weight="400">观察问题 · GOSO</text><text x="888" y="153" font-size="13" fill="#56717d" font-weight="400">阅读路径</text><path d="M288 248 C370 248,386 199,468 199" fill="none" stroke="#237b89" stroke-width="2" opacity=".55"/><path d="M288 358 C370 358,386 271,468 271" fill="none" stroke="#b47227" stroke-width="2" opacity=".55"/><path d="M288 468 C370 468,386 343,468 343" fill="none" stroke="#6571ad" stroke-width="2" opacity=".55"/><path d="M288 248 C370 248,386 415,468 415" fill="none" stroke="#237b89" stroke-width="2" opacity=".55"/><path d="M288 468 C370 468,386 415,468 415" fill="none" stroke="#6571ad" stroke-width="2" opacity=".55"/><path d="M288 358 C370 358,386 487,468 487" fill="none" stroke="#b47227" stroke-width="2" opacity=".55"/><path d="M288 248 C370 248,386 559,468 559" fill="none" stroke="#237b89" stroke-width="2" opacity=".55"/><path d="M288 468 C370 468,386 559,468 559" fill="none" stroke="#6571ad" stroke-width="2" opacity=".55"/><path d="M288 578 C370 578,386 631,468 631" fill="none" stroke="#4b8a67" stroke-width="2" opacity=".55"/><rect x="28" y="204" width="260" height="88" rx="8" fill="#fff" stroke="#237b89"/><text x="44" y="231" font-size="13" fill="#237b89" font-weight="600">X1</text><text x="80" y="231" font-size="19" fill="#183a4b" font-weight="600">人才规模与多样性</text><text x="44" y="266" font-size="15" fill="#56717d" font-weight="400">谁能参与，怎样持续成长？</text><rect x="28" y="314" width="260" height="88" rx="8" fill="#fff" stroke="#b47227"/><text x="44" y="341" font-size="13" fill="#b47227" font-weight="600">X2</text><text x="80" y="341" font-size="19" fill="#183a4b" font-weight="600">技术产出与开放供给</text><text x="44" y="376" font-size="15" fill="#56717d" font-weight="400">有哪些可用、可复用的成果？</text><rect x="28" y="424" width="260" height="88" rx="8" fill="#fff" stroke="#6571ad"/><text x="44" y="451" font-size="13" fill="#6571ad" font-weight="600">X3</text><text x="80" y="451" font-size="19" fill="#183a4b" font-weight="600">全球连接与网络效应</text><text x="44" y="486" font-size="15" fill="#56717d" font-weight="400">贡献与成果怎样连接起来？</text><rect x="28" y="534" width="260" height="88" rx="8" fill="#fff" stroke="#4b8a67"/><text x="44" y="561" font-size="13" fill="#4b8a67" font-weight="600">X4</text><text x="80" y="561" font-size="19" fill="#183a4b" font-weight="600">开源善治与公共价值</text><text x="44" y="596" font-size="15" fill="#56717d" font-weight="400">协作如何持续，价值如何实现？</text><rect x="468" y="167" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="205" font-size="24" fill="#237b89" font-weight="600">V</text><text x="528" y="193" font-size="19" fill="#183a4b" font-weight="600">活跃</text><text x="528" y="215" font-size="12" fill="#56717d" font-weight="400">参与规模 · 地域分布 · 变化趋势</text><text x="784" y="194" font-size="13" fill="#56717d" font-weight="400">2.1</text><rect x="468" y="239" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="277" font-size="24" fill="#237b89" font-weight="600">C</text><text x="528" y="265" font-size="19" fill="#183a4b" font-weight="600">贡献</text><text x="528" y="287" font-size="12" fill="#56717d" font-weight="400">贡献来源 · 贡献强度 · 协作联系</text><text x="784" y="266" font-size="13" fill="#56717d" font-weight="400">2.2</text><rect x="468" y="311" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="349" font-size="24" fill="#237b89" font-weight="600">I</text><text x="528" y="337" font-size="19" fill="#183a4b" font-weight="600">项目影响力</text><text x="528" y="359" font-size="12" fill="#56717d" font-weight="400">影响分布 · 项目结构 · 时间变化</text><text x="784" y="338" font-size="13" fill="#56717d" font-weight="400">2.3</text><rect x="468" y="383" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="421" font-size="24" fill="#237b89" font-weight="600">T</text><text x="528" y="409" font-size="19" fill="#183a4b" font-weight="600">人才</text><text x="528" y="431" font-size="12" fill="#56717d" font-weight="400">人才聚集 · 成长轨迹 · 全球连接</text><text x="784" y="410" font-size="13" fill="#56717d" font-weight="400">2.4</text><rect x="468" y="455" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="493" font-size="24" fill="#237b89" font-weight="600">A</text><text x="528" y="481" font-size="19" fill="#183a4b" font-weight="600">资产</text><text x="528" y="503" font-size="12" fill="#56717d" font-weight="400">代码 · 模型 · 数据</text><text x="784" y="482" font-size="13" fill="#56717d" font-weight="400">2.5</text><rect x="468" y="527" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="565" font-size="24" fill="#237b89" font-weight="600">D</text><text x="528" y="553" font-size="19" fill="#183a4b" font-weight="600">多样性</text><text x="528" y="575" font-size="12" fill="#56717d" font-weight="400">参与结构 · 跨域协作 · 开放连接</text><text x="784" y="554" font-size="13" fill="#56717d" font-weight="400">2.6</text><rect x="468" y="599" width="352" height="64" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="484" y="637" font-size="24" fill="#237b89" font-weight="600">G</text><text x="528" y="625" font-size="19" fill="#183a4b" font-weight="600">治理与社会公益</text><text x="528" y="647" font-size="12" fill="#56717d" font-weight="400">治理实践 · 开放条件 · 公共价值</text><text x="784" y="626" font-size="13" fill="#56717d" font-weight="400">2.7</text><rect x="864" y="167" width="388" height="496" rx="8" fill="#fff" stroke="#d5e2e8"/><text x="888" y="208" font-size="14" fill="#237b89" font-weight="600">七个角度 · 一幅生态全貌</text><text x="888" y="252" font-size="27" fill="#183a4b" font-weight="600">先看参与，</text><text x="888" y="292" font-size="27" fill="#183a4b" font-weight="600">再看创造与价值</text><text x="888" y="341" font-size="18" fill="#183a4b" font-weight="400">从谁在参与，看到贡献与影响；</text><text x="888" y="373" font-size="18" fill="#183a4b" font-weight="400">再进入人才、资产、多样性和治理。</text><text x="888" y="405" font-size="18" fill="#183a4b" font-weight="400">七个主题相互补充，</text><text x="888" y="437" font-size="18" fill="#183a4b" font-weight="400">帮助理解同一生态的不同方面。</text><text x="888" y="510" font-size="17" fill="#237b89" font-weight="400">01   选择关心的发展目标</text><text x="888" y="552" font-size="17" fill="#237b89" font-weight="400">02   寻找关联的观察主题</text><text x="888" y="594" font-size="17" fill="#237b89" font-weight="400">03   阅读第二章对应小节</text><text x="28" y="706" font-size="14" fill="#56717d" font-weight="400">连线表示阅读与研究联系，不代表计算权重；一个主题可以回应多个发展目标。</text><path d="M28 746H1252" stroke="#d5e2e8"/><text x="28" y="776" font-size="14" fill="#56717d" font-weight="400">图 1-3-2 · 从共同目标到生态观察，连接持续共同创造及其公共价值。</text></g></svg>