<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOSD 2026 · 封面至第一章 · 评审演示</title>
<style>
:root{--bg:#071522;--panel:#102C40;--text:#F4F8FC;--muted:#AABCCB;--line:#315064;--accent:#66D5CA;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif}body.light{--bg:#e9eff3;--panel:#fff;--text:#102c40;--muted:#4e6575;--line:#bfd0dc;--accent:#087e79;color-scheme:light}button,a,input,textarea{font:inherit}button,.action{background:none;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 13px;text-decoration:none;cursor:pointer}button:hover,.action:hover{border-color:var(--accent);color:var(--accent)}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[disabled]{opacity:.35;cursor:default}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px;height:66px}header strong{font-size:14px;letter-spacing:.1em;color:var(--accent)}header span{font-size:13px;color:var(--muted)}.tools{display:flex;gap:8px}.tools button,.tools a{font-size:13px}main{height:calc(100dvh - 134px);display:flex;align-items:center;justify-content:center;padding:0 22px}#stage{width:min(calc((100dvh - 134px)*16/9),100%);aspect-ratio:16/9;box-shadow:0 18px 60px #0004;border:1px solid var(--line);overflow:hidden;background:#091B2B}#stage svg{display:block;width:100%;height:100%}svg text{font-family:inherit}svg .hotspot{cursor:pointer}svg .hotspot:hover{fill:var(--accent)}svg .bar-hit{cursor:pointer}svg .bar-hit:hover{opacity:.78}footer{height:68px;display:flex;align-items:center;gap:12px;padding:12px 26px}#counter{font-size:14px;color:var(--muted);min-width:72px;text-align:center}.progress{height:3px;flex:1;background:var(--line);margin:0 10px}.progress i{height:3px;display:block;background:var(--accent);transition:width .2s}#hint{font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);width:min(1080px,94vw);max-height:90dvh;padding:0;box-shadow:0 20px 70px #0008}dialog::backdrop{background:#0009}dialog header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}dialog h2{font-size:21px;margin:0}#drawer{padding:25px 30px;line-height:1.85;overflow:auto}#drawer h3{line-height:1.45;color:var(--accent)}#drawer p{max-width:850px}#drawer .source{white-space:pre-wrap;font-size:16px;line-height:1.9}#drawer .source a{color:var(--accent)}#drawer details{border-top:1px solid var(--line);padding:18px 0}#drawer summary{cursor:pointer;font-weight:bold}#drawer .original svg{width:100%;height:auto;background:white}#drawer .original{overflow:auto;max-height:65vh}#drawer table{border-collapse:collapse;width:100%;font-size:15px}#drawer td,#drawer th{border-bottom:1px solid var(--line);padding:10px;text-align:left}.index{display:grid;grid-template-columns:1fr 1fr;gap:9px}.index button{text-align:left;line-height:1.5;padding:14px}.index small{display:block;color:var(--muted);margin:3px 0 0 32px}label{display:block;margin:12px 0}textarea{width:100%;min-height:155px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:15px}#toast{position:fixed;bottom:83px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:10px 20px;border-radius:8px;font-size:14px;z-index:100}#chart-controls{position:fixed;bottom:77px;right:30px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:none;align-items:center;gap:10px;font-size:13px}#chart-controls input{width:165px}body:fullscreen header .review-label{visibility:hidden}body:fullscreen #hint{visibility:hidden}body:fullscreen main{height:calc(100dvh - 134px)}.flow{stroke-dasharray:8 9;animation:flow 9s linear infinite}@keyframes flow{to{stroke-dashoffset:-170}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:760px){header{height:auto;min-height:84px;padding:12px;flex-wrap:wrap}.tools{flex-wrap:wrap;gap:5px}.tools button,.tools a{font-size:12px;padding:6px 8px}main{height:calc(100dvh - 176px);padding:0 7px}#stage{width:100%;}footer{height:auto;min-height:82px;flex-wrap:wrap;padding:10px;gap:6px}footer button{font-size:12px;padding:7px 9px}#hint,.progress{display:none}#drawer{padding:16px}.index{grid-template-columns:1fr}#chart-controls{bottom:88px;right:10px;left:10px}#chart-controls input{flex:1}}
@media print{body{background:white}header,footer,dialog,#chart-controls{display:none!important}main{height:auto;padding:0}#stage{box-shadow:none;border:0;width:100%}}
</style></head><body>
<header><div><strong>GOSD 2026</strong> <span class="review-label">封面至第一章 · 评审稿</span></div><nav class="tools" aria-label="演示工具"><button data-action="index">目录</button><button data-action="source">正文与来源</button><button data-action="theme">浅色</button><button data-action="fullscreen">全屏</button><button class="action" id="ppt" data-action="download-ppt">下载 PPTX</button></nav></header>
<main><div id="stage" aria-label="当前演示页面"></div></main>
<footer><button data-action="prev" aria-label="上一页">← 上一页</button><span id="counter" aria-live="polite"></span><button data-action="next" aria-label="下一页">下一页 →</button><div class="progress" aria-hidden="true"><i></i></div><span id="hint">← → 翻页 · N 讲解 · Esc 关闭</span><button data-action="notes">讲解提示</button><button data-action="review">评审意见</button></footer>
<div id="chart-controls"><label for="month">查看月份</label><input id="month" type="range" min="0" max="27" value="27"><span id="month-value"></span></div>
<dialog id="dialog"><header><h2 id="dialog-title"></h2><button data-action="close" aria-label="关闭面板">关闭 ×</button></header><div id="drawer"></div></dialog><div id="toast" role="status" hidden></div>
<noscript>本演示需要启用 JavaScript，下载后可在浏览器中打开。</noscript>
<script id="ppt-data" type="application/octet-stream"></script>
<script id="deck-data" type="application/json">__DECK_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('deck-data').textContent),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=Math.max(0,D.slides.findIndex(s=>'#'+s.id===location.hash)),light=false;
const colors={'#091B2B':'#F8FAFC','#F4F8FC':'#142E42','#AABCCB':'#4E6575','#102C40':'#EAF1F6','#315064':'#C1D2DD','#66D5CA':'#087D78','#72B6F2':'#216EA8','#EFC77B':'#98701F','#B7A5ED':'#7658A8'};
const color=c=>light?(colors[c]||c):c;
function svgText(e){let str=`<text x="${e.align==='right'?e.x+e.w:e.align==='center'?e.x+e.w/2:e.x}" y="${e.y+e.size*.88}" fill="${color(e.color)}" font-size="${e.size}" font-weight="${e.bold?700:400}" text-anchor="${e.align==='right'?'end':e.align==='center'?'middle':'start'}"${e.indicator?` class="hotspot" tabindex="0" role="button" data-indicator="${esc(e.indicator)}" aria-label="查看 ${esc(e.text)} 的定义"`:''}>`;e.text.split('\n').forEach((t,i)=>str+=`<tspan x="${e.align==='right'?e.x+e.w:e.align==='center'?e.x+e.w/2:e.x}" dy="${i?e.size*1.35:0}">${esc(t)}</tspan>`);return str+'</text>'}
function chart(e){let str='',f=color('#AABCCB'),grid=color('#315064');if(e.kind==='bar'){
 const label=265,valueWidth=92,plot=e.w-label-valueWidth; const row=e.h/e.categories.length;
 e.categories.forEach((c,i)=>{const val=e.series[0].values[i],bw=plot*val/e.max,y=e.y+i*row;str+=`<g class="bar-hit" tabindex="0" role="button" aria-label="${esc(c)}：${val.toLocaleString()}" data-bar="${i}"><title>${esc(c)}：${val.toLocaleString()} 条贡献记录</title><text x="${e.x+label-12}" y="${y+22}" fill="${f}" font-size="17" text-anchor="end">${esc(c)}</text><rect x="${e.x+label}" y="${y+5}" width="${bw}" height="22" rx="2" fill="${color(e.series[0].color)}"/><text x="${e.x+label+bw+10}" y="${y+22}" fill="${color('#F4F8FC')}" font-size="17">${val.toLocaleString()}</text></g>`});
 }else{const left=e.x+42,top=e.y+12,w=e.w-63,h=e.h-62;for(let v=0;v<=100;v+=25){let y=top+h-h*v/100;str+=`<line x1="${left}" y1="${y}" x2="${left+w}" y2="${y}" stroke="${grid}"/><text x="${left-10}" y="${y+5}" text-anchor="end" fill="${f}" font-size="15">${v}%</text>`}
 e.series.forEach((s,j)=>{let points=s.values.map((v,i)=>`${left+i*w/(s.values.length-1)},${top+h-h*v/100}`).join(' ');str+=`<polyline points="${points}" fill="none" stroke="${color(s.color)}" stroke-width="3.3"/><circle cx="${left+w}" cy="${top+h-h*s.values.at(-1)/100}" r="5" fill="${color(s.color)}"/><text x="${left+j*150}" y="${top+h+54}" fill="${color(s.color)}" font-size="18">● ${esc(s.name)}</text>`});
 [0,7,14,21,27].forEach(i=>{str+=`<text x="${left+i*w/27}" y="${top+h+26}" fill="${f}" text-anchor="middle" font-size="15">${esc(e.categories[i])}</text>`});
 str+=`<line id="month-marker" x1="${left+w}" y1="${top}" x2="${left+w}" y2="${top+h}" stroke="${f}" stroke-dasharray="4 5" opacity=".6"/>`;
 }return str}
function render(){const s=D.slides[current];let svg=`<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slide-title"><title id="slide-title">${esc(s.title||'2026 全球开源发展报告')}</title><rect width="1280" height="720" fill="${color('#091B2B')}"/>`;
 for(const e of s.elements){if(e.type==='text')svg+=svgText(e);else if(e.type==='shape')svg+=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.geometry==='ellipse'?e.w/2:e.r||0}" fill="${color(e.fill)}"/>`;else if(e.type==='line')svg+=`<line x1="${e.x}" y1="${e.y}" x2="${e.x+e.w}" y2="${e.y+e.h}" stroke="${color(e.color)}" stroke-width="${e.width}"/>`;else if(e.type==='chart')svg+=chart(e);else if(e.type==='asset')svg+=`<image href="data:image/svg+xml;base64,${D.assets[e.name]}" x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}"/>`}
 $('#stage').innerHTML=svg+'</svg>';$('#counter').textContent=`${current+1} / ${D.slides.length}`;$('.progress i').style.width=(current+1)/D.slides.length*100+'%';$('[data-action=prev]').disabled=current===0;$('[data-action=next]').disabled=current===D.slides.length-1;$('#chart-controls').style.display=s.id==='model-trend'?'flex':'none';if(s.id==='model-trend')month();try{history.replaceState(null,'','#'+s.id)}catch{}document.title=`${String(current+1).padStart(2,'0')} · ${s.title||'封面'} · GOSD 2026`;}
function go(n){current=Math.max(0,Math.min(D.slides.length-1,n));render()}
function open(title,content){$('#dialog-title').textContent=title;$('#drawer').innerHTML=content;$('#dialog').showModal();$('#drawer').scrollTop=0}
function prose(t){return esc(t).replace(/^#{1,6} (.*)$/gm,'<h3>$1</h3>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/!\[([^\]]*)\]\([^)]*\)/g,'<i>〔图：$1，见本页原图或图件目录〕</i>')}
function source(){const s=D.slides[current];open('正文与来源',`<p><b>${esc(s.title||'封面')}</b><br>${esc(s.note)}</p><p style="color:var(--muted)">${esc(s.sourcePath)}</p>${s.figure?`<details open><summary>对应原图 · ${esc(s.figure)}</summary><div class="original">${D.figures[s.figure]||''}</div></details>`:''}<details open><summary>对应正文全文</summary><div class="source">${prose(D.sources[s.source])}</div></details><details><summary>第一章全部图件</summary>${Object.keys(D.figures).map(k=>`<details><summary>${esc(k)}</summary><div class="original">${D.figures[k]}</div></details>`).join('')}</details>`)}
function indicator(code){const r=D.indicators.find(r=>r.indicator_code===code);if(!r)return;open(r.indicator_name_zh,`<p>${esc(r.pillar_id+' / '+r.dimension_name_zh+' / '+r.role)}</p><table>${[['指标代码','indicator_code'],['定义','definition'],['统计对象','subjects'],['计算规则','calculation_rule'],['单位','unit'],['时间口径','period_rule'],['缺失处理','missing_rule'],['方法状态','method_status'],['数据状态','data_status'],['仍需补齐','remaining_evidence']].map(([a,b])=>`<tr><th>${a}</th><td>${esc(r[b])}</td></tr>`).join('')}</table>`)}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2500)}
function reviews(){try{return JSON.parse(localStorage.getItem('gosd-ch1-review')||'{}')}catch{return {}}}
function review(){const s=D.slides[current],r=reviews();open('逐页评审意见',`<p>${current+1} · ${esc(s.title||'封面')}</p><p>意见保存在当前浏览器。可导出全部意见，供后续修改时逐页对照。</p><label for="review-text">具体问题或修改建议</label><textarea id="review-text" placeholder="例如：本页讲述重点、文字表达、图形或数据口径…">${esc(r[s.id]?.text||'')}</textarea><p><button data-action="save-review">保存本页</button> <button data-action="export-review">导出全部意见</button></p>`)}
function download(name,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function action(a){const s=D.slides[current];if(a==='download-ppt'){const b=$('#ppt-data').textContent.trim();if(!b){toast('请同时下载本次交付的 PPTX 文件。');return;}download('GOSD-2026-Opening-Chapter1-Review-v2.pptx',Uint8Array.from(atob(b),c=>c.charCodeAt(0)),'application/vnd.openxmlformats-officedocument.presentationml.presentation');}if(a==='prev')go(current-1);if(a==='next')go(current+1);if(a==='close')$('#dialog').close();if(a==='source')source();if(a==='notes')open('讲解提示',`<h3>${esc(s.title||'封面')}</h3><p>${esc(s.claim)}</p><p>${esc(s.note)}</p><details><summary>对应正文 · 完整讲述材料</summary><div class="source">${prose(D.sources[s.source])}</div></details>`);if(a==='index')open('演示目录 · '+D.slides.length+' 页',`<p>范围：封面、前置内容、第一章。点击跳转，或使用左右方向键连续讲述。</p><div class="index">${D.slides.map((s,i)=>`<button data-goto="${i}">${String(i+1).padStart(2,'0')}　${esc(s.title||'2026 全球开源发展报告')}<small>${esc(s.part)}</small></button>`).join('')}</div>`);if(a==='theme'){light=!light;document.body.classList.toggle('light',light);$('[data-action=theme]').textContent=light?'深色':'浅色';render()}if(a==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}catch{toast('浏览器未允许全屏，可用浏览器的全屏功能。')}}if(a==='review')review();if(a==='save-review'){const r=reviews();r[s.id]={page:current+1,title:s.title,text:$('#review-text').value,updated:new Date().toISOString()};try{localStorage.setItem('gosd-ch1-review',JSON.stringify(r));toast('本页意见已保存')}catch{toast('浏览器存储不可用，请复制意见后另存。')}}if(a==='export-review'){const r=reviews();if($('#review-text'))r[s.id]={page:current+1,title:s.title,text:$('#review-text').value};download('GOSD-Chapter1-Review-Comments.json',JSON.stringify({version:D.version,comments:r},null,2),'application/json')}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a)action(a.dataset.action);const g=e.target.closest('[data-goto]');if(g){$('#dialog').close();go(+g.dataset.goto)}const i=e.target.closest('[data-indicator]');if(i)indicator(i.dataset.indicator);const b=e.target.closest('[data-bar]');if(b){const key=D.slides[current].id.endsWith('organizations')?'organizations':'contributors',r=D.story[key].rows[+b.dataset.bar];open(r.name,`<p style="font-size:32px;color:var(--accent)">${r.contributions.toLocaleString()} 条贡献记录</p><p>该榜单统计总量占比：${r.percentage}%</p><p>2026.10.11 累计快照。组织与贡献者榜单分别使用各自分母。</p>`)}});
document.addEventListener('keydown',e=>{if($('#dialog').open)return;if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if((e.key==='Enter'||e.key===' ')&&e.target.dataset.indicator){e.preventDefault();indicator(e.target.dataset.indicator);return;}if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(D.slides.length-1)}if(e.key.toLowerCase()==='n')action('notes');if(e.key.toLowerCase()==='f')action('fullscreen');if((e.key==='Enter'||e.key===' ')&&e.target.dataset.indicator)indicator(e.target.dataset.indicator)});
function month(){const i=+$('#month').value,r=D.story.models[i];$('#month-value').textContent=`${r.date}　中国 ${r.china}% / 美国 ${r.unitedStates}% / 欧洲 ${r.europe}%`;const m=$('#month-marker');if(m){const x=96+i*816/27;m.setAttribute('x1',x);m.setAttribute('x2',x)}}$('#month').addEventListener('input',month);window.addEventListener('hashchange',()=>{const i=D.slides.findIndex(s=>'#'+s.id===location.hash);if(i>=0){current=i;render()}});render();window.GOSD_REVIEW={data:D,go,get current(){return current}};
</script></body></html>
