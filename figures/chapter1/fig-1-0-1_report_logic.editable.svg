<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">GOSD 全球开源发展报告：从目标到证据与行动</title><desc id="desc">联合国SDGs提供价值参照，OSDGs形成四支柱十维度目标，OSDI组织二十九项指标；四个核心研究板块共同支撑第六章行动建议。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4C697B"/></marker></defs>
<rect width="1440" height="850" rx="16" fill="#F3F8FA"/>
<g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" fill="#10334D">
<text x="60" y="63" font-size="24" font-weight="700" fill="#156993">GOSD · 全球开源发展报告</text>
<text x="60" y="112" font-size="34" font-weight="700">从共同目标，到可验证的证据与行动</text>
<text x="60" y="145" font-size="18" fill="#4C697B">第一章建立价值、目标与方法基础；四个研究板块交叉使用同一套指标。</text>
<g fill="#FFFFFF" stroke="#CADCE5" stroke-width="1.5"><rect x="60" y="190" width="400" height="145" rx="8"/><rect x="520" y="190" width="400" height="145" rx="8"/><rect x="980" y="190" width="400" height="145" rx="8"/></g>
<g font-size="28" font-weight="700"><text x="85" y="235">UN SDGs</text><text x="545" y="235">OSDG · 开源发展目标</text><text x="1005" y="235">OSDI · 指标体系</text></g>
<g font-size="21"><text x="85" y="275">17 项可持续发展目标</text><text x="545" y="275">4 大支柱 · 10 个维度</text><text x="1005" y="275">29 项指标 · 分项观测</text></g>
<g font-size="17" fill="#4C697B"><text x="85" y="308">价值参照与研究启发</text><text x="545" y="308">本报告提出的目标框架</text><text x="1005" y="308">定义、来源、方法与可用状态</text></g>
<g fill="none" stroke="#4C697B" stroke-width="2" marker-end="url(#arrow)"><path d="M465 263H510"/><path d="M925 263H970"/><path d="M210 425V445"/><path d="M550 425V445"/><path d="M890 425V445"/><path d="M1230 425V445"/></g>
<path d="M1180 339V390H720V425M210 425H1230" fill="none" stroke="#4C697B" stroke-width="2"/>
<text x="60" y="405" font-size="22" font-weight="700">四个核心研究板块</text>
<g fill="#FFFFFF" stroke="#CADCE5" stroke-width="1.5"><rect x="60" y="455" width="300" height="155" rx="8"/><rect x="400" y="455" width="300" height="155" rx="8"/><rect x="740" y="455" width="300" height="155" rx="8"/><rect x="1080" y="455" width="300" height="155" rx="8"/></g>
<g font-size="29" font-weight="700"><text x="84" y="498" fill="#087984">GOSO</text><text x="424" y="498" fill="#2D61A2">GOSR</text><text x="764" y="498" fill="#77538F">GOSL</text><text x="1104" y="498" fill="#3E7B50">GOSM</text></g>
<g font-size="22" font-weight="700"><text x="84" y="540">生态观测地图</text><text x="424" y="540">影响力排行榜</text><text x="764" y="540">技术全景洞察</text><text x="1104" y="540">大模型发展洞察</text></g>
<g font-size="18" fill="#4C697B"><text x="84" y="579">第二章 · 规模与结构</text><text x="424" y="579">第三章 · 贡献与影响</text><text x="764" y="579">第四章 · 组织与演进</text><text x="1104" y="579">第五章 · 供给与复用</text></g>
<g fill="none" stroke="#4C697B" stroke-width="2"><path d="M210 610V645H1230V610M550 610V645M890 610V645"/><path d="M720 645V680" marker-end="url(#arrow)"/></g>
<rect x="350" y="690" width="740" height="90" rx="8" fill="#10334D"/>
<text x="720" y="729" font-size="25" text-anchor="middle" font-weight="700" fill="#FFFFFF">第六章 · 从研究证据形成行动建议</text>
<text x="720" y="760" font-size="18" text-anchor="middle" fill="#BAD2DE">明确行动对象、依据、适用条件与待解决的问题</text>
<text x="60" y="820" font-size="16" fill="#4C697B">结构示意。目标关联不等于成效认证；指标框架不表示本期全部完成测量。</text>
</g></svg>
