<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#f4f8fa"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#6c8793"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#18394c"><text x="28" y="44" font-size="14" fill="#267386" font-weight="600">GOSD / REPORT ARCHITECTURE</text><text x="28" y="88" font-size="32" fill="#18394c" font-weight="600">从共同目标，到可验证的证据与行动</text><text x="28" y="120" font-size="17" fill="#587382" font-weight="400">第一章建立价值与方法基础；四个研究板块交叉观察，第六章汇聚行动。</text><path d="M388 195H460" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 195H892" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 244V282H169V310" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M169 416V444H640V469" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 244V282H483V310" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M483 416V444H640V469" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 244V282H797V310" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M797 416V444H640V469" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M1072 244V282H1111V310" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><path d="M1111 416V444H640V469" fill="none" stroke="#6c8793" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="146" width="360" height="98" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="177" font-size="23" fill="#18394c" font-weight="600">UN SDGs</text><text x="48" y="205" font-size="18" fill="#18394c" font-weight="400">价值参照与研究启发</text><text x="48" y="230" font-size="14" fill="#587382" font-weight="400">17 项可持续发展目标</text><rect x="460" y="146" width="360" height="98" rx="7" fill="#fff" stroke="#cadce5"/><text x="480" y="177" font-size="23" fill="#18394c" font-weight="600">OSDGs</text><text x="480" y="205" font-size="18" fill="#18394c" font-weight="400">开源发展目标</text><text x="480" y="230" font-size="14" fill="#587382" font-weight="400">4 大支柱 · 10 个维度</text><rect x="892" y="146" width="360" height="98" rx="7" fill="#fff" stroke="#cadce5"/><text x="912" y="177" font-size="23" fill="#18394c" font-weight="600">OSDI</text><text x="912" y="205" font-size="18" fill="#18394c" font-weight="400">开源发展目标指标体系</text><text x="912" y="230" font-size="14" fill="#587382" font-weight="400">29 项指标 · 分项观测</text><text x="28" y="267" font-size="15" fill="#18394c" font-weight="600">四个核心研究板块</text><rect x="28" y="310" width="282" height="106" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="343" font-size="26" fill="#279FA9" font-weight="600">GOSO</text><text x="48" y="373" font-size="19" fill="#18394c" font-weight="600">生态观测地图</text><text x="48" y="400" font-size="14" fill="#587382" font-weight="400">第2章 · 规模与结构</text><rect x="342" y="310" width="282" height="106" rx="7" fill="#fff" stroke="#cadce5"/><text x="362" y="343" font-size="26" fill="#4E87C5" font-weight="600">GOSR</text><text x="362" y="373" font-size="19" fill="#18394c" font-weight="600">影响力排行榜</text><text x="362" y="400" font-size="14" fill="#587382" font-weight="400">第3章 · 贡献与影响</text><rect x="656" y="310" width="282" height="106" rx="7" fill="#fff" stroke="#cadce5"/><text x="676" y="343" font-size="26" fill="#9973B7" font-weight="600">GOSL</text><text x="676" y="373" font-size="19" fill="#18394c" font-weight="600">技术全景洞察</text><text x="676" y="400" font-size="14" fill="#587382" font-weight="400">第4章 · 分类与演进</text><rect x="970" y="310" width="282" height="106" rx="7" fill="#fff" stroke="#cadce5"/><text x="990" y="343" font-size="26" fill="#82AE53" font-weight="600">GOSM</text><text x="990" y="373" font-size="19" fill="#18394c" font-weight="600">大模型发展洞察</text><text x="990" y="400" font-size="14" fill="#587382" font-weight="400">第5章 · 供给、复用与开放</text><rect x="390" y="469" width="500" height="76" rx="7" fill="#18394c" stroke="#cadce5"/><text x="440" y="502" font-size="22" fill="#fff" font-weight="600">第六章 · 从研究证据形成行动建议</text><text x="486" y="530" font-size="16" fill="#d7e5ed" font-weight="400">三项共同任务 · 九条主体建议</text><rect x="28" y="582" width="1224" height="145" rx="7" fill="#fff" stroke="#cadce5"/><text x="52" y="619" font-size="20" fill="#18394c" font-weight="600">一条贯穿全书的研究路径</text><text x="52" y="658" font-size="20" fill="#587382" font-weight="400">以共同目标组织观察，结合地图、榜单、技术全景与模型生态理解发展。</text><text x="52" y="690" font-size="20" fill="#587382" font-weight="400">从研究证据形成可落实、可追踪的行动，支持持续共同创造及其公共价值。</text><text x="28" y="777" font-size="14" fill="#587382" font-weight="400">图 1-0-1 · 连线表示研究路径，不代表评分权重；四大支柱交叉服务于各研究板块。</text></g></svg>