<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#f4f8fa"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#6c8793"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#18394c"><text x="28" y="44" font-size="13" fill="#267386" font-weight="600">GOSD / READING THE REPORT</text><text x="28" y="88" font-size="32" fill="#18394c" font-weight="600">六章，一条清晰的阅读路径</text><text x="28" y="119" font-size="16" fill="#587382" font-weight="400">第一章建立基础；第二至第五章提供互补观察；第六章汇聚行动。</text><path d="M462 264V320H129V350" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M129 526V560H462V612" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M462 264V320H351V350" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M351 526V560H462V612" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M462 264V320H573V350" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M573 526V560H462V612" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M462 264V320H795V350" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M795 526V560H462V612" fill="none" stroke="#6c8793" stroke-width="1.5" marker-end="url(#arrow)"/><text x="28" y="147" font-size="13" fill="#587382" font-weight="500">01 / 建立共同基础</text><text x="28" y="302" font-size="13" fill="#587382" font-weight="500">02 / 四个互补视角，可按问题选择阅读</text><text x="28" y="594" font-size="13" fill="#587382" font-weight="500">03 / 从研究走向行动</text><rect x="28" y="164" width="868" height="100" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="190" font-size="13" fill="#267386" font-weight="600">第一章</text><text x="48" y="220" font-size="25" fill="#18394c" font-weight="600">从开放协作到公共价值</text><text x="48" y="246" font-size="16" fill="#587382" font-weight="400">价值参照 → 发展目标 → 观察指标</text><text x="630" y="246" font-size="13" fill="#587382" font-weight="400">SDGs · OSDGs · OSDI</text><rect x="28" y="350" width="202" height="176" rx="7" fill="#fff" stroke="#cadce5"/><path d="M34 350H224" stroke="#279FA9" stroke-width="3"/><text x="44" y="378" font-size="13" fill="#267386" font-weight="600">第2章</text><text x="44" y="411" font-size="21" fill="#18394c" font-weight="600">全球开源生态</text><text x="44" y="440" font-size="21" fill="#18394c" font-weight="600">观测地图</text><text x="44" y="475" font-size="17" fill="#279FA9" font-weight="600">GOSO</text><text x="44" y="505" font-size="13" fill="#587382" font-weight="400">规模与结构</text><rect x="250" y="350" width="202" height="176" rx="7" fill="#fff" stroke="#cadce5"/><path d="M256 350H446" stroke="#9973B7" stroke-width="3"/><text x="266" y="378" font-size="13" fill="#267386" font-weight="600">第3章</text><text x="266" y="411" font-size="21" fill="#18394c" font-weight="600">全球开源</text><text x="266" y="440" font-size="21" fill="#18394c" font-weight="600">影响力排行榜</text><text x="266" y="475" font-size="17" fill="#9973B7" font-weight="600">GOSR</text><text x="266" y="505" font-size="13" fill="#587382" font-weight="400">主体与影响</text><rect x="472" y="350" width="202" height="176" rx="7" fill="#fff" stroke="#cadce5"/><path d="M478 350H668" stroke="#4E87C5" stroke-width="3"/><text x="488" y="378" font-size="13" fill="#267386" font-weight="600">第4章</text><text x="488" y="411" font-size="21" fill="#18394c" font-weight="600">全球开源技术</text><text x="488" y="440" font-size="21" fill="#18394c" font-weight="600">全景洞察</text><text x="488" y="475" font-size="17" fill="#4E87C5" font-weight="600">GOSL</text><text x="488" y="505" font-size="13" fill="#587382" font-weight="400">分类与演进</text><rect x="694" y="350" width="202" height="176" rx="7" fill="#fff" stroke="#cadce5"/><path d="M700 350H890" stroke="#82AE53" stroke-width="3"/><text x="710" y="378" font-size="13" fill="#267386" font-weight="600">第5章</text><text x="710" y="411" font-size="21" fill="#18394c" font-weight="600">全球开源大模型</text><text x="710" y="440" font-size="21" fill="#18394c" font-weight="600">发展洞察</text><text x="710" y="475" font-size="17" fill="#82AE53" font-weight="600">GOSM</text><text x="710" y="505" font-size="13" fill="#587382" font-weight="400">供给、复用与开放</text><rect x="28" y="612" width="868" height="112" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="640" font-size="13" fill="#267386" font-weight="600">第六章</text><text x="48" y="672" font-size="25" fill="#18394c" font-weight="600">未来展望与行动建议</text><text x="48" y="701" font-size="16" fill="#587382" font-weight="400">三项共同任务 · 九条主体建议</text><rect x="930" y="164" width="322" height="560" rx="7" fill="#edf3f6" stroke="#cadce5"/><text x="950" y="194" font-size="13" fill="#267386" font-weight="600">阅读导引</text><text x="950" y="236" font-size="22" fill="#18394c" font-weight="600">从全貌到具体问题</text><text x="950" y="292" font-size="19" fill="#18394c" font-weight="600">顺序阅读</text><text x="950" y="323" font-size="16" fill="#587382" font-weight="400">第一章建立价值与方法基础，</text><text x="950" y="350" font-size="16" fill="#587382" font-weight="400">再进入各章的研究与行动。</text><text x="950" y="414" font-size="19" fill="#18394c" font-weight="600">按需查阅</text><text x="950" y="445" font-size="16" fill="#587382" font-weight="400">第二至第五章是互补视角，</text><text x="950" y="472" font-size="16" fill="#587382" font-weight="400">可按关心的问题选择阅读。</text><text x="950" y="536" font-size="19" fill="#18394c" font-weight="600">关注行动</text><text x="950" y="567" font-size="16" fill="#587382" font-weight="400">第六章连接三项共同任务</text><text x="950" y="594" font-size="16" fill="#587382" font-weight="400">与九条主体建议。</text><text x="28" y="777" font-size="13" fill="#587382" font-weight="400">图 1-0-1 · 共同目标组织观察，研究证据连接行动。连线表示篇章联系，不代表评分权重。</text></g></svg>