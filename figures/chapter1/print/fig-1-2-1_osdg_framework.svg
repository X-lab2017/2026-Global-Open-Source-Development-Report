<svg xmlns="http://www.w3.org/2000/svg" width="640" height="577" viewBox="0 0 640 577" role="img"><title>OSDGs 四大支柱与十个维度</title><rect width="640" height="577" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect x="0" y="7" width="640" height="118" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 8 L639 8" fill="none" stroke="#087984" stroke-width="2"/><text x="13" y="30" font-size="12" fill="#087984" text-anchor="start">X1</text><text x="13" y="52" font-size="13" fill="#087984" text-anchor="start">人才规模与多样性</text><text x="13" y="95" font-size="11.5" fill="#4d6573" text-anchor="start">谁能参与，怎样持续成长？</text><rect x="180.0" y="19" width="216.0" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="191.0" y="39" font-size="11.5" fill="#087984" text-anchor="start">1.1</text><text x="191.0" y="60" font-size="12.5" fill="#18394c" text-anchor="start">规模与密度</text><text x="191.0" y="83" font-size="11.5" fill="#4d6573" text-anchor="start">参与有多广，人才如何分布？</text><rect x="406.0" y="19" width="216.0" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="417.0" y="39" font-size="11.5" fill="#087984" text-anchor="start">1.2</text><text x="417.0" y="60" font-size="12.5" fill="#18394c" text-anchor="start">生态多样性</text><text x="417.0" y="83" font-size="11.5" fill="#4d6573" text-anchor="start">参与者从哪里来，如何跨边界协作？</text><rect x="0" y="137" width="640" height="118" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 138 L639 138" fill="none" stroke="#2d5f9f" stroke-width="2"/><text x="13" y="160" font-size="12" fill="#2d5f9f" text-anchor="start">X2</text><text x="13" y="182" font-size="13" fill="#2d5f9f" text-anchor="start">技术产出与开放供给</text><text x="13" y="225" font-size="11.5" fill="#4d6573" text-anchor="start">有哪些可用、可复用的成果？</text><rect x="180.0" y="149" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="191.0" y="169" font-size="11.5" fill="#2d5f9f" text-anchor="start">2.1</text><text x="191.0" y="190" font-size="12.5" fill="#18394c" text-anchor="start">代码产出</text><text x="191.0" y="213" font-size="11.5" fill="#4d6573" text-anchor="start">协作怎样形成持续的软</text><text x="191.0" y="229" font-size="11.5" fill="#4d6573" text-anchor="start">件产出？</text><rect x="330.66666666666663" y="149" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="341.66666666666663" y="169" font-size="11.5" fill="#2d5f9f" text-anchor="start">2.2</text><text x="341.66666666666663" y="190" font-size="12.5" fill="#18394c" text-anchor="start">模型开放供给</text><text x="341.66666666666663" y="213" font-size="11.5" fill="#4d6573" text-anchor="start">有哪些模型供给，来自</text><text x="341.66666666666663" y="229" font-size="11.5" fill="#4d6573" text-anchor="start">怎样的发布方？</text><rect x="481.3333333333333" y="149" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="492.3333333333333" y="169" font-size="11.5" fill="#2d5f9f" text-anchor="start">2.3</text><text x="492.3333333333333" y="190" font-size="12.5" fill="#18394c" text-anchor="start">数据开放供给</text><text x="492.3333333333333" y="213" font-size="11.5" fill="#4d6573" text-anchor="start">开放数据供给是否充分</text><text x="492.3333333333333" y="229" font-size="11.5" fill="#4d6573" text-anchor="start">且多样？</text><rect x="0" y="267" width="640" height="118" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 268 L639 268" fill="none" stroke="#76508b" stroke-width="2"/><text x="13" y="290" font-size="12" fill="#76508b" text-anchor="start">X3</text><text x="13" y="312" font-size="13" fill="#76508b" text-anchor="start">全球连接与网络效应</text><text x="13" y="355" font-size="11.5" fill="#4d6573" text-anchor="start">贡献与成果怎样连接起来？</text><rect x="180.0" y="279" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="191.0" y="299" font-size="11.5" fill="#76508b" text-anchor="start">3.1</text><text x="191.0" y="320" font-size="12.5" fill="#18394c" text-anchor="start">代码影响力</text><text x="191.0" y="343" font-size="11.5" fill="#4d6573" text-anchor="start">代码贡献如何形成生态</text><text x="191.0" y="359" font-size="11.5" fill="#4d6573" text-anchor="start">影响？</text><rect x="330.66666666666663" y="279" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="341.66666666666663" y="299" font-size="11.5" fill="#76508b" text-anchor="start">3.2</text><text x="341.66666666666663" y="320" font-size="12.5" fill="#18394c" text-anchor="start">模型影响力</text><text x="341.66666666666663" y="343" font-size="11.5" fill="#4d6573" text-anchor="start">模型如何被采用、讨论</text><text x="341.66666666666663" y="359" font-size="11.5" fill="#4d6573" text-anchor="start">和进一步派生？</text><rect x="481.3333333333333" y="279" width="140.66666666666666" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="492.3333333333333" y="299" font-size="11.5" fill="#76508b" text-anchor="start">3.3</text><text x="492.3333333333333" y="320" font-size="12.5" fill="#18394c" text-anchor="start">数据集影响力</text><text x="492.3333333333333" y="343" font-size="11.5" fill="#4d6573" text-anchor="start">数据如何被采用，并支</text><text x="492.3333333333333" y="359" font-size="11.5" fill="#4d6573" text-anchor="start">持后续复用？</text><rect x="0" y="397" width="640" height="118" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><path d="M1 398 L639 398" fill="none" stroke="#407a51" stroke-width="2"/><text x="13" y="420" font-size="12" fill="#407a51" text-anchor="start">X4</text><text x="13" y="442" font-size="13" fill="#407a51" text-anchor="start">开源善治与公共价值</text><text x="13" y="485" font-size="11.5" fill="#4d6573" text-anchor="start">协作如何持续，价值如何实现？</text><rect x="180.0" y="409" width="216.0" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="191.0" y="429" font-size="11.5" fill="#407a51" text-anchor="start">4.1</text><text x="191.0" y="450" font-size="12.5" fill="#18394c" text-anchor="start">治理成熟度</text><text x="191.0" y="473" font-size="11.5" fill="#4d6573" text-anchor="start">谁参与治理，哪些规则有据可查？</text><rect x="406.0" y="409" width="216.0" height="94" rx="5" fill="#ffffff" stroke="#a9bbc4"/><text x="417.0" y="429" font-size="11.5" fill="#407a51" text-anchor="start">4.2</text><text x="417.0" y="450" font-size="12.5" fill="#18394c" text-anchor="start">公共福祉</text><text x="417.0" y="473" font-size="11.5" fill="#4d6573" text-anchor="start">开放技术如何面向公共利益？</text><text x="320" y="572" font-size="13" fill="#18394c" text-anchor="middle">图 1-2-1  OSDGs 四大支柱与十个维度</text></g></svg>