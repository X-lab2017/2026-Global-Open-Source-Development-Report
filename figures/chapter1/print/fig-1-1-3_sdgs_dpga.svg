<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img"><title>联合国 SDGs × 数字公共品联盟 DPGA</title><rect width="640" height="840" fill="white"/><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><text x="0" y="18" font-size="14" fill="#087984" text-anchor="start">图 1-1-3 / PUBLIC VALUE · GOALS &amp; CONDITIONS</text><text x="0" y="61" font-size="28" fill="#18394c" text-anchor="start">联合国 SDGs × 数字公共品联盟 DPGA</text><text x="0" y="91" font-size="15" fill="#4d6573" text-anchor="start">发展方向与实践条件并列呈现，不作逐项对应。</text><text x="0" y="136" font-size="20" fill="#087984" text-anchor="start">希望改善什么？</text><text x="332" y="136" font-size="20" fill="#087984" text-anchor="start">需要具备什么？</text><text x="0" y="163" font-size="14" fill="#4d6573" text-anchor="start">17 项发展目标</text><text x="332" y="163" font-size="14" fill="#4d6573" text-anchor="start">9 项实践条件</text><rect x="0" y="181" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="181" width="4" height="29" rx="0" fill="#e5243b" stroke="#e5243b"/><text x="15" y="201" font-size="13" fill="#4d6573" text-anchor="start">01</text><text x="48" y="201" font-size="13.5" fill="#18394c" text-anchor="start">无贫穷</text><rect x="0" y="213" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="213" width="4" height="29" rx="0" fill="#dda63a" stroke="#dda63a"/><text x="15" y="233" font-size="13" fill="#4d6573" text-anchor="start">02</text><text x="48" y="233" font-size="13.5" fill="#18394c" text-anchor="start">零饥饿</text><rect x="0" y="245" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="245" width="4" height="29" rx="0" fill="#4c9f38" stroke="#4c9f38"/><text x="15" y="265" font-size="13" fill="#4d6573" text-anchor="start">03</text><text x="48" y="265" font-size="13.5" fill="#18394c" text-anchor="start">良好健康与福祉</text><rect x="0" y="277" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="277" width="4" height="29" rx="0" fill="#c5192d" stroke="#c5192d"/><text x="15" y="297" font-size="13" fill="#4d6573" text-anchor="start">04</text><text x="48" y="297" font-size="13.5" fill="#18394c" text-anchor="start">优质教育</text><rect x="0" y="309" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="309" width="4" height="29" rx="0" fill="#ff3a21" stroke="#ff3a21"/><text x="15" y="329" font-size="13" fill="#4d6573" text-anchor="start">05</text><text x="48" y="329" font-size="13.5" fill="#18394c" text-anchor="start">性别平等</text><rect x="0" y="341" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="341" width="4" height="29" rx="0" fill="#26bde2" stroke="#26bde2"/><text x="15" y="361" font-size="13" fill="#4d6573" text-anchor="start">06</text><text x="48" y="361" font-size="13.5" fill="#18394c" text-anchor="start">清洁饮水和卫生设施</text><rect x="0" y="373" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="373" width="4" height="29" rx="0" fill="#fcc30b" stroke="#fcc30b"/><text x="15" y="393" font-size="13" fill="#4d6573" text-anchor="start">07</text><text x="48" y="393" font-size="13.5" fill="#18394c" text-anchor="start">经济适用的清洁能源</text><rect x="0" y="405" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="405" width="4" height="29" rx="0" fill="#a21942" stroke="#a21942"/><text x="15" y="425" font-size="13" fill="#4d6573" text-anchor="start">08</text><text x="48" y="425" font-size="13.5" fill="#18394c" text-anchor="start">体面工作和经济增长</text><rect x="0" y="437" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="437" width="4" height="29" rx="0" fill="#fd6925" stroke="#fd6925"/><text x="15" y="457" font-size="13" fill="#4d6573" text-anchor="start">09</text><text x="48" y="457" font-size="13.5" fill="#18394c" text-anchor="start">产业、创新和基础设施</text><rect x="0" y="469" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="469" width="4" height="29" rx="0" fill="#dd1367" stroke="#dd1367"/><text x="15" y="489" font-size="13" fill="#4d6573" text-anchor="start">10</text><text x="48" y="489" font-size="13.5" fill="#18394c" text-anchor="start">减少不平等</text><rect x="0" y="501" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="501" width="4" height="29" rx="0" fill="#fd9d24" stroke="#fd9d24"/><text x="15" y="521" font-size="13" fill="#4d6573" text-anchor="start">11</text><text x="48" y="521" font-size="13.5" fill="#18394c" text-anchor="start">可持续城市和社区</text><rect x="0" y="533" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="533" width="4" height="29" rx="0" fill="#bf8b2e" stroke="#bf8b2e"/><text x="15" y="553" font-size="13" fill="#4d6573" text-anchor="start">12</text><text x="48" y="553" font-size="13.5" fill="#18394c" text-anchor="start">负责任消费和生产</text><rect x="0" y="565" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="565" width="4" height="29" rx="0" fill="#3f7e44" stroke="#3f7e44"/><text x="15" y="585" font-size="13" fill="#4d6573" text-anchor="start">13</text><text x="48" y="585" font-size="13.5" fill="#18394c" text-anchor="start">气候行动</text><rect x="0" y="597" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="597" width="4" height="29" rx="0" fill="#0a97d9" stroke="#0a97d9"/><text x="15" y="617" font-size="13" fill="#4d6573" text-anchor="start">14</text><text x="48" y="617" font-size="13.5" fill="#18394c" text-anchor="start">水下生物</text><rect x="0" y="629" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="629" width="4" height="29" rx="0" fill="#56c02b" stroke="#56c02b"/><text x="15" y="649" font-size="13" fill="#4d6573" text-anchor="start">15</text><text x="48" y="649" font-size="13.5" fill="#18394c" text-anchor="start">陆地生物</text><rect x="0" y="661" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="661" width="4" height="29" rx="0" fill="#00689d" stroke="#00689d"/><text x="15" y="681" font-size="13" fill="#4d6573" text-anchor="start">16</text><text x="48" y="681" font-size="13.5" fill="#18394c" text-anchor="start">和平、正义与强大机构</text><rect x="0" y="693" width="307" height="29" rx="2" fill="#ffffff" stroke="#a9bbc4"/><rect x="0" y="693" width="4" height="29" rx="0" fill="#19486a" stroke="#19486a"/><text x="15" y="713" font-size="13" fill="#4d6573" text-anchor="start">17</text><text x="48" y="713" font-size="13.5" fill="#18394c" text-anchor="start">促进目标实现的伙伴关系</text><rect x="332" y="181" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="200" font-size="12" fill="#087984" text-anchor="start">01</text><text x="373" y="200" font-size="14" fill="#18394c" text-anchor="start">SDG 相关性</text><text x="373" y="219" font-size="12" fill="#4d6573" text-anchor="start">说明与可持续发展目标的关联。</text><rect x="332" y="241" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="260" font-size="12" fill="#087984" text-anchor="start">02</text><text x="373" y="260" font-size="14" fill="#18394c" text-anchor="start">开放许可</text><text x="373" y="279" font-size="12" fill="#4d6573" text-anchor="start">提供允许复用的开放许可。</text><rect x="332" y="301" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="320" font-size="12" fill="#087984" text-anchor="start">03</text><text x="373" y="320" font-size="14" fill="#18394c" text-anchor="start">清晰权属</text><text x="373" y="339" font-size="12" fill="#4d6573" text-anchor="start">说明数字成果的权属。</text><rect x="332" y="361" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="380" font-size="12" fill="#087984" text-anchor="start">04</text><text x="373" y="380" font-size="14" fill="#18394c" text-anchor="start">平台独立性</text><text x="373" y="399" font-size="12" fill="#4d6573" text-anchor="start">说明对封闭平台的依赖。</text><rect x="332" y="421" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="440" font-size="12" fill="#087984" text-anchor="start">05</text><text x="373" y="440" font-size="14" fill="#18394c" text-anchor="start">文档</text><text x="373" y="459" font-size="12" fill="#4d6573" text-anchor="start">提供理解和采用所需的资料。</text><rect x="332" y="481" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="500" font-size="12" fill="#087984" text-anchor="start">06</text><text x="373" y="500" font-size="14" fill="#18394c" text-anchor="start">非个人识别数据提取</text><text x="373" y="519" font-size="12" fill="#4d6573" text-anchor="start">在适用时支持非个人识别数据提取。</text><rect x="332" y="541" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="560" font-size="12" fill="#087984" text-anchor="start">07</text><text x="373" y="560" font-size="14" fill="#18394c" text-anchor="start">隐私与适用法律</text><text x="373" y="579" font-size="12" fill="#4d6573" text-anchor="start">披露隐私及适用法律要求。</text><rect x="332" y="601" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="620" font-size="12" fill="#087984" text-anchor="start">08</text><text x="373" y="620" font-size="14" fill="#18394c" text-anchor="start">标准与最佳实践</text><text x="373" y="639" font-size="12" fill="#4d6573" text-anchor="start">遵循相关标准和实践。</text><rect x="332" y="661" width="308" height="56" rx="3" fill="#f2f6f7" stroke="#a9bbc4"/><text x="344" y="680" font-size="12" fill="#087984" text-anchor="start">09</text><text x="373" y="680" font-size="14" fill="#18394c" text-anchor="start">不造成伤害</text><text x="373" y="699" font-size="12" fill="#4d6573" text-anchor="start">数据安全、有害内容与骚扰防护。</text><rect x="0" y="745" width="640" height="67" rx="5" fill="#f2f6f7" stroke="#a9bbc4"/><text x="16" y="770" font-size="16" fill="#18394c" text-anchor="start">开放软件 · 开放数据 · 开放 AI 系统 · 开放内容</text><text x="16" y="795" font-size="15" fill="#4d6573" text-anchor="start">目标相关性、标准符合性与地方实施成效，需要分别判断。</text><text x="0" y="837" font-size="12.5" fill="#4d6573" text-anchor="start">DPG 条件为简述；据 DPGA Standard 改编（CC BY-SA 4.0）。本图不表示认证。</text></g></svg>