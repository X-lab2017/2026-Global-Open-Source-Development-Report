<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>让产品使用，带动开放基础的维护</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-3-1 / ACTION OVERVIEW</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">让产品使用，带动开放基础的维护</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">三条建议总览 · 网页版可逐条查看实施步骤、协作分工与后续观察。</text><text x="28" y="163" font-size="13" font-weight="600" fill="#156993">行动建议</text><text x="420" y="163" font-size="13" font-weight="600" fill="#156993">实施步骤</text><text x="938" y="163" font-size="13" font-weight="600" fill="#156993">后续观察</text><rect x="28" y="187" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="216" font-size="12" font-weight="400" fill="#156993">04 / 可维护、可复用的基础</text><text x="48" y="257" font-size="22" font-weight="600" fill="#18394c">把上游维护纳入产品责任</text><path d="M378 262H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="187" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="223" font-size="17" font-weight="400" fill="#18394c">1  看清关键依赖</text><text x="440" y="266" font-size="17" font-weight="400" fill="#18394c">2  承担维护工作</text><text x="440" y="309" font-size="17" font-weight="400" fill="#18394c">3  检验支持是否有效</text><path d="M890 262H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="187" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="223" font-size="17" font-weight="400" fill="#18394c">责任覆盖</text><text x="958" y="266" font-size="17" font-weight="400" fill="#18394c">回馈落实</text><text x="958" y="309" font-size="17" font-weight="400" fill="#18394c">交接连续</text><rect x="28" y="361" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="390" font-size="12" font-weight="400" fill="#156993">05 / 透明治理与公共价值</text><text x="48" y="431" font-size="22" font-weight="600" fill="#18394c">让每次发布清晰、可用、可追溯</text><path d="M378 436H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="361" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="397" font-size="17" font-weight="400" fill="#18394c">1  整理版本材料</text><text x="440" y="440" font-size="17" font-weight="400" fill="#18394c">2  提供可用入口</text><text x="440" y="483" font-size="17" font-weight="400" fill="#18394c">3  持续修订档案</text><path d="M890 436H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="361" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="397" font-size="17" font-weight="400" fill="#18394c">材料对应</text><text x="958" y="440" font-size="17" font-weight="400" fill="#18394c">示例可用</text><text x="958" y="483" font-size="17" font-weight="400" fill="#18394c">变化可追踪</text><rect x="28" y="535" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="564" font-size="12" font-weight="400" fill="#156993">06 / 持续参与与人才成长</text><text x="48" y="605" font-size="22" font-weight="600" fill="#18394c">为协作者成长提供时间与认可</text><path d="M378 610H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="535" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="571" font-size="17" font-weight="400" fill="#18394c">1  预留协作时间</text><text x="440" y="614" font-size="17" font-weight="400" fill="#18394c">2  开放多种角色</text><text x="440" y="657" font-size="17" font-weight="400" fill="#18394c">3  形成成长路径</text><path d="M890 610H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="535" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="571" font-size="17" font-weight="400" fill="#18394c">参与持续性</text><text x="958" y="614" font-size="17" font-weight="400" fill="#18394c">贡献角色</text><text x="958" y="657" font-size="17" font-weight="400" fill="#18394c">外部协作</text><text x="28" y="750" font-size="14" font-weight="400" fill="#587382">三项共同任务贯穿不同主体；具体实施应结合项目需要与当地条件。</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">行动路径示意 · 连线不表示数量、权重或已经验证的因果关系。</text></g></svg>