<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1060" viewBox="0 0 880 1060" role="img"><title>公共支持的三条行动路径</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1060" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">实施步骤 → 协作分工 → 后续观察</text><rect x="24" y="50" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">01  让公共支持延伸到长期维护</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">可维护、可复用的基础</text><rect x="40" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  识别共同依赖</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">从真实使用和维护记录出发，确</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">认项目边界与支持缺口。</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">公共资助方</text><text x="40" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">提供持续支持安排</text><text x="40" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">责任是否清楚</text><rect x="316" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  约定持续支持</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">明确维护事项、责任团队、支持</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">周期与交接安排。</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">基金会与使用方</text><text x="316" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">核查需求并共同投入</text><text x="316" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">支持能否延续</text><rect x="592" y="118" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  复盘维护变化</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">结合工作负担与使用反馈，继</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">续、调整或平稳结束支持。</text><text x="592" y="270" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">维护团队</text><text x="592" y="295" text-anchor="start" font-size="16" font-weight="400" fill="#587382">记录工作与人员接续</text><text x="592" y="339" text-anchor="start" font-size="16" font-weight="600" fill="#156993">使用问题有无改善</text><rect x="24" y="370" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="397" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">02  把人才支持连接到真实共建任务</text><text x="40" y="423" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">持续参与与人才成长</text><rect x="40" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  开放真实任务</text><text x="52" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">把教学与合作需求放到可参与的</text><text x="52" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">项目中。</text><path d="M290 498H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">地区与国际组织</text><text x="40" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">连接区域节点与全球南方伙伴</text><text x="40" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">能否持续参与</text><rect x="316" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  配置参与条件</text><text x="328" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">安排导师、文档、工具与多语言</text><text x="328" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">协作。</text><path d="M566 498H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">高校与企业</text><text x="316" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">开放任务与导师支持</text><text x="316" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">角色能否成长</text><rect x="592" y="438" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="464" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  观察后续成长</text><text x="604" y="513" text-anchor="start" font-size="16" font-weight="400" fill="#587382">固定参与批次，记录持续贡献、</text><text x="604" y="535" text-anchor="start" font-size="16" font-weight="400" fill="#587382">角色变化和退出原因。</text><text x="592" y="590" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">社区与学习者</text><text x="592" y="615" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同完成并维护成果</text><text x="592" y="659" text-anchor="start" font-size="16" font-weight="600" fill="#156993">合作是否延续</text><rect x="24" y="690" width="832" height="302" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="717" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">03  把开放交付与公共结果分开验收</text><text x="40" y="743" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">透明治理与公共价值</text><rect x="40" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1  明确公共需求</text><text x="52" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">由实施方与目标使用者共同确定</text><text x="52" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">问题和观察范围。</text><path d="M290 818H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">公共资助方</text><text x="40" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">明确交付与评价要求</text><text x="40" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">交付是否可查</text><rect x="316" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2  记录版本化交付</text><text x="328" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">逐项保存开放材料、许可说明、</text><text x="328" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">维护与变更记录。</text><path d="M566 818H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">发布与实施团队</text><text x="316" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">保留版本和使用记录</text><text x="316" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">使用是否发生</text><rect x="592" y="758" width="250" height="132" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="784" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3  复核使用与结果</text><text x="604" y="833" text-anchor="start" font-size="16" font-weight="400" fill="#587382">公开具体部署与结果材料，说明</text><text x="604" y="855" text-anchor="start" font-size="16" font-weight="400" fill="#587382">适用范围和未知项。</text><text x="592" y="910" text-anchor="start" font-size="14.5" font-weight="400" fill="#587382">本地伙伴与研究者</text><text x="592" y="935" text-anchor="start" font-size="16" font-weight="400" fill="#587382">共同评价真实结果</text><text x="592" y="979" text-anchor="start" font-size="16" font-weight="600" fill="#156993">结果是否可验证</text><text x="440" y="1019" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">图 6-2-1 公共支持的三条行动路径</text><text x="440" y="1047" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">前文证据与行动建议的关系示意；连线不表示数量、权重或已验证的因果关系。</text></g></svg>