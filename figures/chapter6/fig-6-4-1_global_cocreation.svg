<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>从一次加入，走向长期共同建设</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-4-1 / ACTION OVERVIEW</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">从一次加入，走向长期共同建设</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">三条建议总览 · 网页版可逐条查看实施步骤、协作分工与后续观察。</text><text x="28" y="163" font-size="13" font-weight="600" fill="#156993">行动建议</text><text x="420" y="163" font-size="13" font-weight="600" fill="#156993">实施步骤</text><text x="938" y="163" font-size="13" font-weight="600" fill="#156993">后续观察</text><rect x="28" y="187" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="216" font-size="12" font-weight="400" fill="#156993">07 / 持续参与与人才成长</text><text x="48" y="257" font-size="22" font-weight="600" fill="#18394c">让新人走向共同维护者</text><path d="M378 262H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="187" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="223" font-size="17" font-weight="400" fill="#18394c">1  找到第一个任务</text><text x="440" y="266" font-size="17" font-weight="400" fill="#18394c">2  参与共同评审</text><text x="440" y="309" font-size="17" font-weight="400" fill="#18394c">3  接续维护责任</text><path d="M890 262H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="187" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="223" font-size="17" font-weight="400" fill="#18394c">入口是否可用</text><text x="958" y="266" font-size="17" font-weight="400" fill="#18394c">参与是否延续</text><text x="958" y="309" font-size="17" font-weight="400" fill="#18394c">角色是否开放</text><rect x="28" y="361" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="390" font-size="12" font-weight="400" fill="#156993">08 / 可维护、可复用的基础</text><text x="48" y="431" font-size="22" font-weight="600" fill="#18394c">围绕共同依赖组织跨地区维护</text><path d="M378 436H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="361" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="397" font-size="17" font-weight="400" fill="#18394c">1  找到共同需求</text><text x="440" y="440" font-size="17" font-weight="400" fill="#18394c">2  约定共同任务</text><text x="440" y="483" font-size="17" font-weight="400" fill="#18394c">3  延续合作记录</text><path d="M890 436H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="361" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="397" font-size="17" font-weight="400" fill="#18394c">共同任务</text><text x="958" y="440" font-size="17" font-weight="400" fill="#18394c">改进回流</text><text x="958" y="483" font-size="17" font-weight="400" fill="#18394c">维护延续</text><rect x="28" y="535" width="350" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="48" y="564" font-size="12" font-weight="400" fill="#156993">09 / 透明治理与公共价值</text><text x="48" y="605" font-size="22" font-weight="600" fill="#18394c">让公共需求进入共同设计与治理</text><path d="M378 610H415" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="420" y="535" width="470" height="150" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="440" y="571" font-size="17" font-weight="400" fill="#18394c">1  共同定义问题</text><text x="440" y="614" font-size="17" font-weight="400" fill="#18394c">2  公开协作与决策</text><text x="440" y="657" font-size="17" font-weight="400" fill="#18394c">3  把结果带回项目</text><path d="M890 610H933" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.5" marker-end="url(#arrow)"/><rect x="938" y="535" width="314" height="150" rx="7" fill="#fff" stroke="#cadce5"/><text x="958" y="571" font-size="17" font-weight="400" fill="#18394c">谁在参与</text><text x="958" y="614" font-size="17" font-weight="400" fill="#18394c">谁在受益</text><text x="958" y="657" font-size="17" font-weight="400" fill="#18394c">经验是否延续</text><text x="28" y="750" font-size="14" font-weight="400" fill="#587382">三项共同任务贯穿不同主体；具体实施应结合项目需要与当地条件。</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">行动路径示意 · 连线不表示数量、权重或已经验证的因果关系。</text></g></svg>