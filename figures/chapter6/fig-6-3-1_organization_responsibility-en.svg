<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1360" viewBox="0 0 880 1360" role="img"><title>Collaboration responsibilities of organizations</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1360" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">STEPS → RESPONSIBILITIES → FOLLOW-UP</text><rect x="24" y="50" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">04  Make upstream maintenance part of product responsibility</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Maintainable, reusable foundations</text><rect x="40" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Identify critical</text><text x="52" y="167" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">dependencies</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Verify versions, upstream</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">sources and dependent</text><text x="52" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">products.</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Product teams · Describe</text><text x="40" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">dependencies and needs</text><text x="40" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Ownership coverage</text><rect x="316" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Share maintenance work</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Assign accountable teams</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">and return fixes and</text><text x="328" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">adaptations upstream.</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Engineering and maintainers ·</text><text x="316" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Allocate time and contribute</text><text x="316" y="372" text-anchor="start" font-size="15" font-weight="400" fill="#587382">improvements</text><text x="316" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Upstream contributions</text><rect x="592" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Review the support</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Use product issues and</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">upstream feedback to</text><text x="604" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">refine support and</text><text x="604" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">handovers.</text><text x="592" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Upstream communities · Review</text><text x="592" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">and organize maintenance</text><text x="592" y="372" text-anchor="start" font-size="15" font-weight="400" fill="#587382">together</text><text x="592" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Continuity through handovers</text><rect x="24" y="470" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="497" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">05  Make every release clear, usable and traceable</text><text x="40" y="523" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Governance &amp; public value</text><rect x="40" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Organize version</text><text x="52" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">materials</text><text x="52" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Connect code, models,</text><text x="52" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">data descriptions and</text><text x="52" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">upstream information.</text><path d="M290 598H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Release teams · Prepare</text><text x="40" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">materials and runnable</text><text x="40" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">examples</text><text x="40" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Material consistency</text><rect x="316" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Provide a usable entry</text><text x="328" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">point</text><text x="328" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Publish runnable</text><text x="328" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">examples, usage</text><text x="328" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">conditions and a feedback</text><text x="328" y="679" text-anchor="start" font-size="16" font-weight="400" fill="#587382">channel.</text><path d="M566 598H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Reviewers and maintainers ·</text><text x="316" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Review conditions and changes</text><text x="316" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Usable examples</text><rect x="592" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Keep the record</text><text x="604" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">current</text><text x="604" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Track version changes,</text><text x="604" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">known limitations and</text><text x="604" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">downstream feedback.</text><text x="592" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Downstream users · Check</text><text x="592" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">materials and report</text><text x="592" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">adaptation issues</text><text x="592" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Traceable changes</text><rect x="24" y="890" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="917" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">06  Give contributors time and recognition to grow</text><text x="40" y="943" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Participation and growth</text><rect x="40" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Allocate collaboration</text><text x="52" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">time</text><text x="52" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Plan for upstream work,</text><text x="52" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">external review and</text><text x="52" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">documentation.</text><path d="M290 1018H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Engineering leaders · Allocate</text><text x="40" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">time and recognition</text><text x="40" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Participation continuity</text><rect x="316" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Open multiple roles</text><text x="328" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Recognize code, testing,</text><text x="328" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">translation and support</text><text x="328" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">contributions.</text><path d="M566 1018H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Teams and mentors · Offer</text><text x="316" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">feedback and development</text><text x="316" y="1212" text-anchor="start" font-size="15" font-weight="400" fill="#587382">opportunities</text><text x="316" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Contribution roles</text><rect x="592" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Create growth paths</text><text x="604" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Help contributors</text><text x="604" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">progress into review,</text><text x="604" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">release and maintenance</text><text x="604" y="1099" text-anchor="start" font-size="16" font-weight="400" fill="#587382">roles.</text><text x="592" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">External collaborators · Join</text><text x="592" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">tasks and shared reviews</text><text x="592" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">External collaboration</text><text x="440" y="1319" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">Figure 6-3-1 Collaboration responsibilities of organizations</text><text x="440" y="1347" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">Proposed pathways; lines do not encode quantity, weight or established causality.</text></g></svg>