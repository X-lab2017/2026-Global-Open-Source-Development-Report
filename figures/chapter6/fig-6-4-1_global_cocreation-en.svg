<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1360" viewBox="0 0 880 1360" role="img"><title>Co-creation by communities and global partners</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1360" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">STEPS → RESPONSIBILITIES → FOLLOW-UP</text><rect x="24" y="50" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="77" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">07  Create paths from newcomers to co-maintainers</text><text x="40" y="103" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Participation and growth</text><rect x="40" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Find a first task</text><text x="52" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Make task scope,</text><text x="52" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">documentation and help</text><text x="52" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">channels clear.</text><path d="M290 178H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Community maintainers · Open</text><text x="40" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">practices and tasks</text><text x="40" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Accessible entry points</text><rect x="316" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Join shared reviews</text><text x="328" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Mentors and collaborators</text><text x="328" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">provide feedback and</text><text x="328" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">recognize varied</text><text x="328" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">contributions.</text><path d="M566 178H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Mentors and partners · Provide</text><text x="316" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">continued feedback</text><text x="316" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Continued involvement</text><rect x="592" y="118" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="144" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Take on maintenance</text><text x="604" y="193" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Publish progression and</text><text x="604" y="215" text-anchor="start" font-size="16" font-weight="400" fill="#587382">handover practices to</text><text x="604" y="237" text-anchor="start" font-size="16" font-weight="400" fill="#587382">reduce dependence on a</text><text x="604" y="259" text-anchor="start" font-size="16" font-weight="400" fill="#587382">few people.</text><text x="592" y="328" text-anchor="start" font-size="15" font-weight="400" fill="#587382">New participants · Complete</text><text x="592" y="350" text-anchor="start" font-size="15" font-weight="400" fill="#587382">tasks and grow into</text><text x="592" y="372" text-anchor="start" font-size="15" font-weight="400" fill="#587382">responsibility</text><text x="592" y="439" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Accessible roles</text><rect x="24" y="470" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="497" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">08  Organize cross-region maintenance around shared dependencies</text><text x="40" y="523" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Maintainable, reusable foundations</text><rect x="40" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Find shared needs</text><text x="52" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Contact maintainers and</text><text x="52" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">users through verified</text><text x="52" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">dependencies and reuse.</text><path d="M290 598H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Upstream maintainers ·</text><text x="40" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Describe capabilities and</text><text x="40" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">maintenance needs</text><text x="40" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Shared tasks</text><rect x="316" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Agree on shared work</text><text x="328" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Agree adaptation,</text><text x="328" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">evaluation and</text><text x="328" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance tasks,</text><text x="328" y="679" text-anchor="start" font-size="16" font-weight="400" fill="#587382">involving local partners</text><text x="328" y="701" text-anchor="start" font-size="16" font-weight="400" fill="#587382">in decisions.</text><path d="M566 598H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Downstream and local partners</text><text x="316" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">· Adapt together and return</text><text x="316" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">experience</text><text x="316" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Returned improvements</text><rect x="592" y="538" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="564" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Sustain the</text><text x="604" y="587" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">collaboration</text><text x="604" y="613" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Return improvements</text><text x="604" y="635" text-anchor="start" font-size="16" font-weight="400" fill="#587382">upstream and retain</text><text x="604" y="657" text-anchor="start" font-size="16" font-weight="400" fill="#587382">version and maintenance</text><text x="604" y="679" text-anchor="start" font-size="16" font-weight="400" fill="#587382">records.</text><text x="592" y="748" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Collaboration supporters ·</text><text x="592" y="770" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Sustain resources and shared</text><text x="592" y="792" text-anchor="start" font-size="15" font-weight="400" fill="#587382">responsibilities</text><text x="592" y="859" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Continued maintenance</text><rect x="24" y="890" width="832" height="402" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="40" y="917" text-anchor="start" font-size="19" font-weight="600" fill="#18394c">09  Bring public needs into shared design and governance</text><text x="40" y="943" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">Governance &amp; public value</text><rect x="40" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="52" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">1 Define the problem</text><text x="52" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">together</text><text x="52" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Involve local partners</text><text x="52" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">and users in needs and</text><text x="52" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">evaluation design.</text><path d="M290 1018H316" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="40" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Local partners and users ·</text><text x="40" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Define needs and join</text><text x="40" y="1212" text-anchor="start" font-size="15" font-weight="400" fill="#587382">evaluation</text><text x="40" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Who participates</text><rect x="316" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="328" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">2 Document collaboration</text><text x="328" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">and decisions</text><text x="328" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Record adaptations,</text><text x="328" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">important decisions and</text><text x="328" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">maintenance</text><text x="328" y="1099" text-anchor="start" font-size="16" font-weight="400" fill="#587382">responsibilities.</text><path d="M566 1018H592" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><text x="316" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Communities and implementers ·</text><text x="316" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Adapt and maintain together</text><text x="316" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Who benefits</text><rect x="592" y="958" width="250" height="204" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="604" y="984" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">3 Return outcomes to the</text><text x="604" y="1007" text-anchor="start" font-size="17" font-weight="600" fill="#18394c">project</text><text x="604" y="1033" text-anchor="start" font-size="16" font-weight="400" fill="#587382">Examine use and outcomes,</text><text x="604" y="1055" text-anchor="start" font-size="16" font-weight="400" fill="#587382">then carry improvements</text><text x="604" y="1077" text-anchor="start" font-size="16" font-weight="400" fill="#587382">into the next cycle.</text><text x="592" y="1168" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Researchers and supporters ·</text><text x="592" y="1190" text-anchor="start" font-size="15" font-weight="400" fill="#587382">Help document and examine</text><text x="592" y="1212" text-anchor="start" font-size="15" font-weight="400" fill="#587382">outcomes</text><text x="592" y="1279" text-anchor="start" font-size="16" font-weight="600" fill="#156993">Whether learning continues</text><text x="440" y="1319" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">Figure 6-4-1 Co-creation by communities and global partners</text><text x="440" y="1347" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">Proposed pathways; lines do not encode quantity, weight or established causality.</text></g></svg>