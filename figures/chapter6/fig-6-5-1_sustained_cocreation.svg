<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img"><title>持续共同创造与行动反馈</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L7 3.5L0 7" fill="#156993"/></marker></defs><rect width="880" height="1000" fill="#ffffff"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="24" y="26" text-anchor="start" font-size="16" font-weight="600" fill="#156993">从参与到反馈：每个环节都需要责任主体与记录</text><path d="M404 174.0H452" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M642 280V335" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M642 547V602" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M452 708.0H404" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M214 602V547" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><path d="M214 335V280" stroke="#156993" stroke-width="1.5" fill="none" opacity="0.75" marker-end="url(#arrow)"/><rect x="24" y="68" width="380" height="212" rx="6" fill="#edf5f8" stroke="#cadce5"/><text x="41" y="96" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">01</text><text x="79" y="96" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">持续参与</text><text x="41" y="127" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让更多人能够加入</text><text x="41" y="179" text-anchor="start" font-size="16" font-weight="400" fill="#587382">任务、工具、导师与多语言协作提供参与条件。</text><text x="41" y="203" text-anchor="start" font-size="16" font-weight="400" fill="#587382">观察同一批参与者能否继续贡献，并逐步承担新</text><text x="41" y="227" text-anchor="start" font-size="16" font-weight="400" fill="#587382">的责任。</text><rect x="452" y="68" width="380" height="212" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="96" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">02</text><text x="507" y="96" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">共同贡献</text><text x="469" y="127" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让不同工作得到连接</text><text x="469" y="179" text-anchor="start" font-size="16" font-weight="400" fill="#587382">代码、评审、文档、翻译、测试与支持共同构成</text><text x="469" y="203" text-anchor="start" font-size="16" font-weight="400" fill="#587382">协作。贡献记录帮助看见工作，责任分工帮助工</text><text x="469" y="227" text-anchor="start" font-size="16" font-weight="400" fill="#587382">作持续。</text><rect x="452" y="335" width="380" height="212" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="363" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">03</text><text x="507" y="363" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">开放成果</text><text x="469" y="394" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让版本与条件清楚</text><text x="469" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#587382">代码、模型与数据需要清晰的版本、材料、许可</text><text x="469" y="470" text-anchor="start" font-size="16" font-weight="400" fill="#587382">和维护入口。开放条件使后续使用者能够判断怎</text><text x="469" y="494" text-anchor="start" font-size="16" font-weight="400" fill="#587382">样采用与继续改进。</text><rect x="452" y="602" width="380" height="212" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="469" y="630" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">04</text><text x="507" y="630" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">采用与再创造</text><text x="469" y="661" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让一次发布连接下一次创造</text><text x="469" y="713" text-anchor="start" font-size="16" font-weight="400" fill="#587382">采用、适配与派生把已有成果带入新的任务。保</text><text x="469" y="737" text-anchor="start" font-size="16" font-weight="400" fill="#587382">留上游关系与具体版本，让使用经验和改进有机</text><text x="469" y="761" text-anchor="start" font-size="16" font-weight="400" fill="#587382">会回到共同基础。</text><rect x="24" y="602" width="380" height="212" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="41" y="630" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">05</text><text x="79" y="630" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">公共价值</text><text x="41" y="661" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让真实使用与结果可验证</text><text x="41" y="713" text-anchor="start" font-size="16" font-weight="400" fill="#587382">从公共需求进入具体应用，再观察实际受益与局</text><text x="41" y="737" text-anchor="start" font-size="16" font-weight="400" fill="#587382">限。由本地使用者、实施者和研究者共同提供证</text><text x="41" y="761" text-anchor="start" font-size="16" font-weight="400" fill="#587382">据，帮助下一轮改进。</text><rect x="24" y="335" width="380" height="212" rx="6" fill="#ffffff" stroke="#cadce5"/><text x="41" y="363" text-anchor="start" font-size="14.5" font-weight="400" fill="#156993">06</text><text x="79" y="363" text-anchor="start" font-size="18" font-weight="600" fill="#18394c">持续支持</text><text x="41" y="394" text-anchor="start" font-size="16" font-weight="400" fill="#156993">让经验与资源回到共建</text><text x="41" y="446" text-anchor="start" font-size="16" font-weight="400" fill="#587382">根据维护需要与真实结果，调整资源、规则和参</text><text x="41" y="470" text-anchor="start" font-size="16" font-weight="400" fill="#587382">与机会。把支持延伸到日常维护、人员接续与新</text><text x="41" y="494" text-anchor="start" font-size="16" font-weight="400" fill="#587382">的公共需求，开启下一轮共同创造。</text><text x="440" y="864" text-anchor="middle" font-size="19" font-weight="600" fill="#156993">持续共同创造及其公共价值</text><text x="440" y="899" text-anchor="middle" font-size="17" font-weight="400" fill="#587382">维护让成果延续，反馈让行动改进。</text><text x="440" y="959" text-anchor="middle" font-size="18" font-weight="600" fill="#18394c">图 6-5-1 持续共同创造与行动反馈</text><text x="440" y="987" text-anchor="middle" font-size="14.5" font-weight="400" fill="#587382">前文证据与行动建议的关系示意；连线不表示数量、权重或已验证的因果关系。</text></g></svg>