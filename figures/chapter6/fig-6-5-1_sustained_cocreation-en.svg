<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>Connect one act of creation to the next</title><rect width="1280" height="800" fill="#f3f8fa"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#156993"/></marker></defs><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#18394c"><text x="28" y="42" font-size="13" font-weight="600" fill="#156993">6-5-1 / SUSTAINED CO-CREATION</text><text x="28" y="87" font-size="30" font-weight="600" fill="#18394c">Connect one act of creation to the next</text><text x="28" y="120" font-size="16" font-weight="400" fill="#587382">Maintenance sustains assets. Feedback improves action.</text><path d="M760 182C890 182 1068 195 1068 244" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M1068 328V454" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M948 496C860 550 830 600 760 600" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M520 600C420 600 340 545 332 496" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M212 454V328" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><path d="M332 286C430 202 446 182 520 182" stroke="#156993" stroke-width="1.8" fill="none" opacity="0.65" marker-end="url(#arrow)"/><rect x="520" y="140" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="537" y="171" font-size="20" font-weight="600" fill="#18394c">Participate</text><text x="537" y="197" font-size="12" font-weight="400" fill="#587382">Enable more people to join</text><rect x="948" y="244" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="965" y="275" font-size="20" font-weight="600" fill="#18394c">Contribute</text><text x="965" y="301" font-size="12" font-weight="400" fill="#587382">Connect different kinds of</text><text x="965" y="318" font-size="12" font-weight="400" fill="#587382">work</text><rect x="948" y="454" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="965" y="485" font-size="20" font-weight="600" fill="#18394c">Share open assets</text><text x="965" y="511" font-size="12" font-weight="400" fill="#587382">Make versions and conditions</text><text x="965" y="528" font-size="12" font-weight="400" fill="#587382">clear</text><rect x="520" y="558" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="537" y="589" font-size="20" font-weight="600" fill="#18394c">Use and recreate</text><text x="537" y="615" font-size="12" font-weight="400" fill="#587382">Connect one release to the</text><text x="537" y="632" font-size="12" font-weight="400" fill="#587382">next creation</text><rect x="92" y="454" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="109" y="485" font-size="20" font-weight="600" fill="#18394c">Public value</text><text x="109" y="511" font-size="12" font-weight="400" fill="#587382">Examine actual use and</text><text x="109" y="528" font-size="12" font-weight="400" fill="#587382">outcomes</text><rect x="92" y="244" width="240" height="84" rx="7" fill="#fff" stroke="#cadce5"/><text x="109" y="275" font-size="20" font-weight="600" fill="#18394c">Sustain support</text><text x="109" y="301" font-size="12" font-weight="400" fill="#587382">Return learning and resources</text><text x="109" y="318" font-size="12" font-weight="400" fill="#587382">to collaboration</text><text x="490" y="350" font-size="13" font-weight="600" fill="#156993">CO-CREATION</text><text x="430" y="394" font-size="30" font-weight="600" fill="#18394c">Sustained co-creation</text><text x="430" y="437" font-size="30" font-weight="600" fill="#18394c">and its public value</text><rect x="28" y="660" width="1224" height="90" rx="7" fill="#e5f0f4" stroke="#cadce5"/><text x="50" y="695" font-size="20" font-weight="600" fill="#18394c">Share responsibility, examine progress</text><text x="50" y="725" font-size="17" font-weight="400" fill="#587382">Return actual use and outcomes to the next round of support so shared creation can continue.</text><text x="28" y="781" font-size="12" font-weight="400" fill="#587382">Action pathways · Lines do not encode quantities, weights or established causal effects.</text></g></svg>